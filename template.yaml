AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ButterFi - Sidewalk-to-Web bridge for students without home internet.
  Receives text queries over Amazon Sidewalk, scrapes/summarizes web content,
  and returns chunked responses sized for Sidewalk's constrained payloads.

Parameters:
  SidewalkDestinationName:
    Type: String
    Default: ButterFiDestination
    Description: Name for the Sidewalk device destination

  MaxChunkBytes:
    Type: Number
    Default: 240
    Description: >
      Max payload bytes per downlink chunk. Sidewalk FSK supports 250 bytes,
      but we reserve 10 bytes for chunk headers (sequence number, total chunks, flags).

  ScraperTimeoutSeconds:
    Type: Number
    Default: 30
    Description: Timeout for the scraper Lambda

  ChunkTTLHours:
    Type: Number
    Default: 2
    Description: >-
      Hours to keep chunked responses in DynamoDB before TTL expiry. Kept short
      on purpose: chunks only need to outlive the in-progress transfer and its
      resend window, so a low value minimizes how long browsed page content
      lives at rest. Raise it only if slow links need a longer resend window.

  ArtifactBucket:
    Type: String
    Default: butterfi-deploy-us-east-1
    Description: >-
      Public us-east-1 S3 bucket holding the Brotli layer zip (the same bucket
      the Launch Stack template comes from). Leave as-is unless you host your
      own copy.

  BrotliLayerKey:
    Type: String
    Default: layers/brotli-1.2.1-py312-x86_64.zip
    Description: >-
      Object key of the Brotli Python layer in ArtifactBucket. Published by
      .github/workflows/publish-template.yml; versioned and never overwritten.

Resources:

  # ---------------------------------------------------------------
  # DynamoDB - Chunk store for multi-message responses
  # ---------------------------------------------------------------
  ChunkTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: deviceId
          AttributeType: S
        - AttributeName: chunkKey
          AttributeType: S
      KeySchema:
        - AttributeName: deviceId
          KeyType: HASH
        - AttributeName: chunkKey
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: ButterFi

  # ---------------------------------------------------------------
  # Content policy - per-school allowlist / blocklist of domains.
  # Items: { listType: "ALLOW" | "BLOCK", domain: "<registrable domain>" }.
  # Empty table = open web (default). Edited with scripts/manage-policy.py.
  # ---------------------------------------------------------------
  PolicyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: listType
          AttributeType: S
        - AttributeName: domain
          AttributeType: S
      KeySchema:
        - AttributeName: listType
          KeyType: HASH
        - AttributeName: domain
          KeyType: RANGE
      # Admin-curated safety config, so keep point-in-time backups.
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: ButterFi

  # ---------------------------------------------------------------
  # SQS - Decouple scraping from chunk delivery
  # ---------------------------------------------------------------
  ScrapeQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 60
      MessageRetentionPeriod: 3600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ScrapeDeadLetterQueue.Arn
        maxReceiveCount: 3

  ScrapeDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 86400

  # ---------------------------------------------------------------
  # IAM - Lambda execution roles
  # ---------------------------------------------------------------
  UplinkLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ButterFiUplinkPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt ScrapeQueue.Arn
              - Effect: Allow
                Action:
                  - iot:Publish
                Resource: !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/butterfi/resend/*'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt ChunkTable.Arn

  ScraperLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ButterFiScraperPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ScrapeQueue.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem   # Seq counter (reserve_seqs)
                Resource: !GetAtt ChunkTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource: !GetAtt PolicyTable.Arn
              - Effect: Allow
                Action:
                  - iot:Publish
                Resource: !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/butterfi/*'
              - Effect: Allow
                Action:
                  - iotwireless:SendDataToWirelessDevice
                Resource: '*'

  DownlinkLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ButterFiDownlinkPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem   # Seq counter (reserve_seqs)
                Resource: !GetAtt ChunkTable.Arn
              - Effect: Allow
                Action:
                  - iotwireless:SendDataToWirelessDevice
                Resource: '*'

  SidewalkRuleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              # iotwireless assumes this role to deliver Sidewalk uplinks to the
              # destination; iot is for the topic-rule Lambda action.
              Service:
                - iot.amazonaws.com
                - iotwireless.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ButterFiIoTRulePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt UplinkLambda.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              # IoT Wireless assumes this role to deliver each Sidewalk uplink to
              # the destination: it calls iot:DescribeEndpoint to find the data
              # endpoint, then iot:Publish to the destination topic. Without
              # DescribeEndpoint the delivery 403s and the uplink silently never
              # reaches the rule (diagnosable only via Network Analyzer).
              - Effect: Allow
                Action:
                  - iot:DescribeEndpoint
                Resource: '*'
              - Effect: Allow
                Action:
                  - iot:Publish
                Resource: !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/butterfi/uplink'

  DestinationManagerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ButterFiDestinationManagerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iotwireless:CreateDestination
                  - iotwireless:UpdateDestination
                  - iotwireless:DeleteDestination
                  - iotwireless:GetDestination
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt SidewalkRuleRole.Arn

  DestinationManagerLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt DestinationManagerLambdaRole.Arn
      Timeout: 60
      MemorySize: 128
      Code:
        ZipFile: |
          import json
          import os
          import urllib.request
          import boto3
          from botocore.exceptions import ClientError, EndpointConnectionError

          SUPPORTED_REGIONS = set(boto3.session.Session().get_available_regions('iotwireless'))

          def get_client(props):
              region = props.get('Region') or os.environ.get('AWS_REGION')
              return boto3.client('iotwireless', region_name=region)

          def send_response(event, context, status, data, physical_resource_id=None, reason=None):
              body = {
                  'Status': status,
                  'Reason': reason or f'See CloudWatch Log Stream: {context.log_stream_name}',
                  'PhysicalResourceId': physical_resource_id or context.log_stream_name,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data,
              }
              request = urllib.request.Request(
                  event['ResponseURL'],
                  data=json.dumps(body).encode('utf-8'),
                  method='PUT',
                  headers={'content-type': ''},
              )
              # nosec B310 - ResponseURL is the CloudFormation-provided pre-signed
              # S3 callback URL, not user input; this is the standard custom-resource
              # response and never fetches an attacker-controlled address.
              with urllib.request.urlopen(request):  # nosec B310
                  return

          def destination_arn(name, event):
              return f"arn:aws:iotwireless:{event['ResourceProperties']['Region']}:{event['ResourceProperties']['AccountId']}:destination/{name}"

          def create_destination(props, event):
              client = get_client(props)
              client.create_destination(
                  Name=props['Name'],
                  ExpressionType=props['ExpressionType'],
                  Expression=props['Expression'],
                  Description=props.get('Description', ''),
                  RoleArn=props['RoleArn'],
              )
              return props['Name']

          def update_destination(props, old_props, event):
              new_name = props['Name']
              old_name = old_props['Name']
              client = get_client(props)

              if new_name != old_name:
                  create_destination(props, event)
                  try:
                      client.delete_destination(Name=old_name)
                  except ClientError as exc:
                      if exc.response['Error']['Code'] != 'ResourceNotFoundException':
                          raise
                  return new_name

              client.update_destination(
                  Name=new_name,
                  ExpressionType=props['ExpressionType'],
                  Expression=props['Expression'],
                  Description=props.get('Description', ''),
                  RoleArn=props['RoleArn'],
              )
              return new_name

          def delete_destination(name):
              client = boto3.client('iotwireless', region_name=os.environ.get('AWS_REGION'))
              try:
                  client.delete_destination(Name=name)
              except ClientError as exc:
                  if exc.response['Error']['Code'] != 'ResourceNotFoundException':
                      raise

          def handler(event, context):
              props = event['ResourceProperties']
              request_type = event['RequestType']
              region = props.get('Region') or os.environ.get('AWS_REGION')

              try:
                  if region not in SUPPORTED_REGIONS:
                      raise ValueError(
                          'IoT Wireless destinations are not available in '
                          f'{region}. Deploy this stack in a supported region such as '
                          f'{", ".join(sorted(SUPPORTED_REGIONS))}.'
                      )

                  if request_type == 'Create':
                      name = create_destination(props, event)
                  elif request_type == 'Update':
                      name = update_destination(props, event['OldResourceProperties'], event)
                  elif request_type == 'Delete':
                      name = event.get('PhysicalResourceId', props['Name'])
                      delete_destination(name)
                  else:
                      raise ValueError(f'Unsupported request type: {request_type}')

                  send_response(
                      event,
                      context,
                      'SUCCESS',
                      {
                          'Name': name,
                          'Arn': destination_arn(name, event),
                      },
                      physical_resource_id=name,
                  )
              except EndpointConnectionError:
                      send_response(
                      event,
                      context,
                      'FAILED',
                      {
                          'Error': (
                            f'IoT Wireless endpoint is unavailable in {region}. '
                              f'Deploy this stack in a supported region such as {", ".join(sorted(SUPPORTED_REGIONS))}.'
                          )
                      },
                      physical_resource_id=event.get('PhysicalResourceId', props.get('Name', context.log_stream_name)),
                      reason=(
                          f'IoT Wireless endpoint is unavailable in {region}. '
                          f'Deploy this stack in a supported region such as {", ".join(sorted(SUPPORTED_REGIONS))}.'
                      )
                  )
              except Exception as exc:
                  send_response(
                      event,
                      context,
                      'FAILED',
                      {'Error': str(exc)},
                      physical_resource_id=event.get('PhysicalResourceId', props.get('Name', context.log_stream_name)),
                      reason=str(exc),
                  )

  # ---------------------------------------------------------------
  # Lambda - Uplink handler (receives Sidewalk messages)
  # ---------------------------------------------------------------
  UplinkLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt UplinkLambdaRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          SCRAPE_QUEUE_URL: !Ref ScrapeQueue
          CHUNK_TABLE: !Ref ChunkTable
      Code:
        ZipFile: |
          """
          ButterFi Uplink Handler
          
          Receives base64-encoded Sidewalk uplink payloads from IoT Core.
          Parses the query (URL or text search) and enqueues a scrape job.
          
          Uplink payload format (binary):
            byte 0:    message type (0x01 = query, 0x02 = chunk request, 0x03 = ack)
            byte 1:    request ID (rolling 0-255, used to correlate response chunks)
            byte 2..N: payload
              - type 0x01: query string (URL or search terms)
              - type 0x02: next needed chunk index as 1 byte
              - type 0x03: last received chunk index as 1 byte
          """
          import json
          import os
          import base64
          import boto3
          import time

          sqs = boto3.client('sqs')
          dynamodb = boto3.resource('dynamodb')

          QUEUE_URL = os.environ['SCRAPE_QUEUE_URL']
          TABLE = os.environ['CHUNK_TABLE']

          def handler(event, context):
              # Never log the raw event: PayloadData carries the student's
              # query (URL or search terms). Only metadata is logged below.

              # IoT Core Sidewalk uplinks arrive with PayloadData (base64)
              payload_b64 = event.get('PayloadData', '')
              # Use the WirelessDeviceId (UUID) downstream: it is what
              # SendDataToWirelessDevice needs to address the downlink. The
              # Sidewalk SidewalkId (short hex) is only for reference/logging.
              device_id = event.get('WirelessDeviceId', 'unknown')
              sidewalk_id = event.get('WirelessMetadata', {}).get('Sidewalk', {}).get('SidewalkId', 'unknown')

              if not payload_b64:
                  print('No payload data')
                  return {'statusCode': 400}

              raw = base64.b64decode(payload_b64)
              # Amazon Sidewalk delivers the app payload hex-encoded: PayloadData
              # is the base64 of an ASCII hex string (e.g. b'0101687474...'), not
              # the raw bytes. Peel the hex layer; tolerate already-raw data.
              try:
                  raw = bytes.fromhex(raw.decode('ascii'))
              except (ValueError, UnicodeDecodeError):
                  pass
              if len(raw) < 2:
                  print(f'Payload too short: {len(raw)} bytes')
                  return {'statusCode': 400}

              msg_type = raw[0]
              request_id = raw[1]
              body = raw[2:]
              query = ''
              control_value = None

              if msg_type == 0x01:
                  if not body:
                      print('Query payload missing')
                      return {'statusCode': 400}
                  query = body.decode('utf-8', errors='replace')
              elif msg_type in (0x02, 0x03):
                  if len(body) != 1:
                      print(f'Invalid control payload length for type {msg_type:#x}: {len(body)}')
                      return {'statusCode': 400}
                  control_value = body[0]

              if msg_type == 0x01:
                  # Privacy: never log the query/URL text. The query is a child's
                  # browsing activity; log only non-content metadata for debugging.
                  print(f'device={device_id} type={msg_type:#x} req={request_id} qlen={len(query)}')
              elif msg_type in (0x02, 0x03):
                  print(f'device={device_id} type={msg_type:#x} req={request_id} value={control_value}')
              else:
                  print(f'device={device_id} type={msg_type:#x} req={request_id}')

              if msg_type == 0x01:  # New query
                  sqs.send_message(
                      QueueUrl=QUEUE_URL,
                      MessageBody=json.dumps({
                          'deviceId': device_id,
                          'requestId': request_id,
                          'query': query,
                          'timestamp': int(time.time())
                      })
                  )
                  return {'statusCode': 202}

              elif msg_type == 0x02:  # Re-request chunks
                  # Client is asking for chunks to be re-sent from the next
                  # needed chunk index; handled by the downlink lambda.
                  iot = boto3.client('iot-data')
                  iot.publish(
                      topic=f'butterfi/resend/{device_id}',
                      payload=json.dumps({
                          'deviceId': device_id,
                          'requestId': request_id,
                          'startIdx': control_value
                      })
                  )
                  return {'statusCode': 200}

              elif msg_type == 0x03:  # ACK
                  print(f'ACK from {device_id} for chunk {control_value}')
                  return {'statusCode': 200}

              return {'statusCode': 400, 'body': 'Unknown message type'}

  UplinkLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UplinkLambda
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !GetAtt SidewalkUplinkRule.Arn

  # ---------------------------------------------------------------
  # Lambda layer - Brotli encoder for the Scraper
  # The Python runtime has no brotli module. CloudFormation copies this zip
  # from the public deploy bucket into the deploying account, so the one-click
  # Launch Stack flow is unchanged.
  # ---------------------------------------------------------------
  BrotliLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      Description: Brotli (Python) for ButterFi response compression
      CompatibleRuntimes:
        - python3.12
      CompatibleArchitectures:
        - x86_64
      Content:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref BrotliLayerKey

  # ---------------------------------------------------------------
  # Lambda - Scraper (fetches pages, chunks, sends downlinks)
  # ---------------------------------------------------------------
  ScraperLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ScraperLambdaRole.Arn
      Timeout: !Ref ScraperTimeoutSeconds
      # 512 MB buys twice the CPU of 256 MB (Lambda scales CPU with memory),
      # which brotli-11 on a long page needs to stay well inside the timeout.
      MemorySize: 512
      Layers:
        - !Ref BrotliLayer
      Environment:
        Variables:
          CHUNK_TABLE: !Ref ChunkTable
          POLICY_TABLE: !Ref PolicyTable
          MAX_CHUNK_BYTES: !Ref MaxChunkBytes
          CHUNK_TTL_HOURS: !Ref ChunkTTLHours
      Code:
        ZipFile: |
          """
          ButterFi Scraper
          
          Triggered by SQS. Fetches a URL or performs a search,
          strips HTML to plain text, chunks into Sidewalk-sized payloads,
          stores chunks in DynamoDB, and sends the first chunk as a downlink.
          
          Chunk storage format in DynamoDB:
            deviceId:  Sidewalk device ID (hash key)
            chunkKey:  "{requestId}#{chunkIndex:04d}" (range key)
            data:      base64-encoded chunk payload
            total:     total number of chunks
            ttl:       epoch expiry
          
          Downlink payload format (binary):
            byte 0:    message type (0x81 = response chunk)
            byte 1:    request ID
            byte 2:    chunk index (0-based)
            byte 3:    total chunks
            byte 4..N: response payload bytes ([format][data], chunked)
          """
          import json
          import os
          import base64
          import time
          import urllib.request
          import urllib.error
          import urllib.parse
          import re
          import socket
          import ipaddress
          import gzip
          import boto3
          try:
              # From BrotliLayer (a zip in the public deploy bucket). If the layer
              # is missing, responses fall back to gzip and still work.
              import brotli
          except ImportError:
              brotli = None

          # -------------------------------------------------------
          # Student fetches resolve through Cloudflare for Families (1.1.1.3),
          # which blocks malware and adult sites at the resolver. Only the fetch
          # path uses it (boto3's AWS calls keep the normal resolver), so there is
          # no name-based exemption a student URL could ride (an S3 website or
          # API Gateway host under .amazonaws.com used to skip the filter).
          #
          # Every check here fails CLOSED: if Cloudflare can't be reached the page
          # is not fetched (no fallback to an unfiltered resolver), and URLs typed
          # as IP addresses are refused (the filter can't judge them). The answers
          # are checked (public addresses only) and the connection goes to exactly
          # those addresses, so a domain can't pass the check with one answer and
          # then rebind to 127.0.0.1 or 169.254.169.254 for the real connect.
          # -------------------------------------------------------
          import struct
          import http.client

          CF_FAMILIES_DNS = ('1.1.1.3', '1.0.0.3')

          # A bare hostname like "cnn.com" or "text.npr.org/story" (no scheme)
          # should be fetched as a URL, not sent to search. Match one+ dotted
          # labels ending in a letters-only TLD, with an optional port/path.
          BARE_DOMAIN = re.compile(r'^(?:[a-z0-9-]+\.)+[a-z]{2,}(?:[:/?#].*)?$', re.I)


          class FetchBlocked(Exception):
              """A safety check refused this fetch. str() is a user-facing reason."""


          def _skip_dns_name(resp, offset):
              """Offset just past a DNS name (labels, ending in 0 or a pointer)."""
              while True:
                  n = resp[offset]
                  if n & 0xC0 == 0xC0:
                      return offset + 2
                  if n == 0:
                      return offset + 1
                  offset += n + 1


          def parse_dns_a_reply(resp, tx_id):
              """IPv4 strings from a DNS reply; [] for NXDOMAIN / no A records.
              Raises ValueError on a mismatched, failed or truncated reply."""
              if len(resp) < 12 or resp[:2] != tx_id or not resp[2] & 0x80:
                  raise ValueError('mismatched DNS reply')
              if resp[2] & 0x02:
                  raise ValueError('truncated DNS reply')
              rcode = resp[3] & 0x0F
              if rcode == 3:  # NXDOMAIN
                  return []
              if rcode != 0:
                  raise ValueError(f'DNS error rcode={rcode}')
              qdcount, ancount = struct.unpack('!HH', resp[4:8])
              offset = 12
              for _ in range(qdcount):
                  offset = _skip_dns_name(resp, offset) + 4  # + qtype, qclass
              ips = []
              for _ in range(ancount):  # CNAMEs are skipped; their A records follow
                  offset = _skip_dns_name(resp, offset)
                  rtype, _cls, _ttl, rdlen = struct.unpack('!HHIH', resp[offset:offset + 10])
                  offset += 10
                  if rtype == 1 and rdlen == 4:
                      ips.append(socket.inet_ntoa(resp[offset:offset + 4]))
                  offset += rdlen
              return ips


          def _dns_query_a(name, server, timeout=3):
              """Minimal DNS A query over UDP (name is already IDNA/ASCII)."""
              tx_id = os.urandom(2)
              qname = b''.join(bytes([len(l)]) + l.encode('ascii') for l in name.split('.'))
              packet = (tx_id + b'\x01\x00'                     # recursion desired
                        + b'\x00\x01\x00\x00\x00\x00\x00\x00'  # 1 question
                        + qname + b'\x00' + b'\x00\x01\x00\x01')  # A, IN
              sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              sock.settimeout(timeout)
              try:
                  sock.sendto(packet, (server, 53))
                  resp, _ = sock.recvfrom(4096)
              finally:
                  sock.close()
              return parse_dns_a_reply(resp, tx_id)


          def resolve_public(host):
              """Family-filtered public IPv4 addresses for host, or raise FetchBlocked."""
              host = (host or '').strip().rstrip('.').lower()
              try:
                  ipaddress.ip_address(host)
              except ValueError:
                  pass
              else:
                  raise FetchBlocked('addresses typed as numbers are not allowed; '
                                     'use the site\'s name')
              try:
                  name = host.encode('idna').decode('ascii')
              except UnicodeError:
                  raise FetchBlocked('that is not a valid site name')
              labels = name.split('.')
              if not name or len(name) > 253 or any(not l or len(l) > 63 for l in labels):
                  raise FetchBlocked('that is not a valid site name')
              ips, last_err = None, None
              for server in CF_FAMILIES_DNS:
                  try:
                      ips = _dns_query_a(name, server)
                      break
                  except Exception as exc:
                      last_err = exc
              if ips is None:
                  print(f'family DNS unreachable: {last_err}')
                  raise FetchBlocked('the safety filter could not be reached, so '
                                     'nothing was fetched. Try again in a minute')
              if not ips:
                  raise FetchBlocked('that site could not be found')
              if '0.0.0.0' in ips:  # Cloudflare for Families' answer for a blocked site
                  raise FetchBlocked('that site is blocked by the safety filter')
              for ip in ips:
                  addr = ipaddress.ip_address(ip)
                  if not addr.is_global or addr.is_multicast:
                      raise FetchBlocked(f'that site points to a non-public address ({ip})')
              return ips


          def _pinned_create_connection(address, timeout=socket._GLOBAL_DEFAULT_TIMEOUT,
                                        source_address=None, **kwargs):
              """socket.create_connection, but only to resolve_public's vetted IPs."""
              host, port = address
              last_err = None
              for ip in resolve_public(host):
                  try:
                      return socket.create_connection((ip, port), timeout, source_address)
                  except OSError as exc:
                      last_err = exc
              raise last_err


          # http.client connects through self._create_connection; TLS then wraps
          # the socket with server_hostname=self.host, so SNI and certificate
          # checks still use the real name.
          class _PinnedHTTPConnection(http.client.HTTPConnection):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, **kwargs)
                  self._create_connection = _pinned_create_connection


          class _PinnedHTTPSConnection(http.client.HTTPSConnection):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, **kwargs)
                  self._create_connection = _pinned_create_connection


          class _PinnedHTTPHandler(urllib.request.HTTPHandler):
              def http_open(self, req):
                  return self.do_open(_PinnedHTTPConnection, req)


          class _PinnedHTTPSHandler(urllib.request.HTTPSHandler):
              def https_open(self, req):
                  return self.do_open(_PinnedHTTPSConnection, req, context=self._context)

          dynamodb = boto3.resource('dynamodb')
          iot_wireless = boto3.client('iotwireless')

          CHUNK_TABLE = os.environ['CHUNK_TABLE']
          POLICY_TABLE = os.environ.get('POLICY_TABLE', '')
          MAX_CHUNK = int(os.environ['MAX_CHUNK_BYTES'])
          CHUNK_TTL = int(os.environ['CHUNK_TTL_HOURS'])

          # Overhead: type(1) + requestId(1) + chunkIdx(1) + totalChunks(1) = 4 bytes
          TEXT_CHUNK_SIZE = MAX_CHUNK - 4


          def unwrap_ddg_redirect(url):
              """DuckDuckGo result links are tracking redirects of the form
              duckduckgo.com/l/?uddg=<percent-encoded-real-url>&rut=... The /l/
              redirector doesn't serve a fetchable page to this scraper (the
              fetch hangs), so return the real destination and fetch it directly.
              parse_qs already percent-decodes the value once, which is exactly
              right — the wrapper double-encodes the destination's own query."""
              try:
                  from urllib.parse import urlparse, parse_qs
                  parsed = urlparse(url)
                  host = parsed.netloc.lower()
                  is_ddg = host == 'duckduckgo.com' or host.endswith('.duckduckgo.com')
                  if is_ddg and parsed.path.rstrip('/') == '/l':
                      uddg = parse_qs(parsed.query).get('uddg')
                      if uddg and uddg[0].startswith(('http://', 'https://')):
                          return uddg[0]
              except Exception:
                  pass
              return url


          def html_to_butterfi(html, source_url=''):
              """Convert HTML to ButterFi markup — a compact, readable format
              that preserves document structure while minimizing byte count.

              ButterFi markup spec:
                #  Heading 1
                ## Heading 2
                ### Heading 3
                Regular paragraph text with >1[linked text] inline.
                - Unordered list item
                1. Ordered list item
                ---
                (separator)
                >1 https://example.com
                >2 https://other.com
                (link references collected at the end)

              The PWA renders these as interactive elements.
              Links use numbered references to keep inline text short.
              """
              from html.parser import HTMLParser

              class ButterFiParser(HTMLParser):
                  def __init__(self):
                      super().__init__()
                      self.output = []
                      self.links = {}        # ref_num -> url
                      self.link_counter = 0
                      self.tag_stack = []
                      self.current_line = ''
                      self.in_link = False
                      self.link_text = ''
                      self.link_href = ''
                      self.in_list_item = False
                      self.ordered_list_idx = 0
                      self.skip = False      # inside script/style/nav/footer
                      self.skip_depth = 0

                      # Tags whose content we discard entirely
                      self.skip_tags = {'script', 'style', 'nav', 'footer',
                                        'header', 'noscript', 'svg', 'form',
                                        'iframe', 'object', 'embed'}

                  def _flush_line(self):
                      line = self.current_line.strip()
                      if line:
                          self.output.append(line)
                      self.current_line = ''

                  def handle_starttag(self, tag, attrs):
                      attrs_dict = dict(attrs)
                      tag = tag.lower()

                      if tag in self.skip_tags:
                          self.skip = True
                          self.skip_depth += 1
                          return

                      if self.skip:
                          if tag in self.skip_tags:
                              self.skip_depth += 1
                          return

                      self.tag_stack.append(tag)

                      if tag in ('h1', 'h2', 'h3', 'h4', 'h5', 'h6'):
                          self._flush_line()
                          level = int(tag[1])
                          prefix = '#' * min(level, 3)
                          self.current_line = prefix + ' '

                      elif tag == 'a' and 'href' in attrs_dict:
                          href = attrs_dict['href']
                          # Skip fragment-only and javascript links
                          if href and not href.startswith('#') and not href.startswith('javascript:'):
                              self.in_link = True
                              self.link_text = ''
                              self.link_href = href
                              # Resolve relative URLs
                              if source_url and not href.startswith(('http://', 'https://')):
                                  from urllib.parse import urljoin
                                  self.link_href = urljoin(source_url, href)
                              # Unwrap DuckDuckGo tracking redirects to the real URL
                              self.link_href = unwrap_ddg_redirect(self.link_href)

                      elif tag == 'br':
                          self._flush_line()

                      elif tag in ('p', 'div', 'section', 'article', 'main', 'blockquote'):
                          self._flush_line()

                      elif tag == 'li':
                          self._flush_line()
                          self.in_list_item = True
                          # Check if parent is ol
                          if 'ol' in self.tag_stack:
                              self.ordered_list_idx += 1
                              self.current_line = f'{self.ordered_list_idx}. '
                          else:
                              self.current_line = '- '

                      elif tag == 'ol':
                          self._flush_line()
                          self.ordered_list_idx = 0

                      elif tag == 'ul':
                          self._flush_line()

                      elif tag == 'hr':
                          self._flush_line()
                          self.output.append('---')

                      elif tag == 'img':
                          alt = attrs_dict.get('alt', '')
                          if alt and len(alt) < 100:
                              self.current_line += f'[img: {alt}]'

                  def handle_endtag(self, tag):
                      tag = tag.lower()

                      if tag in self.skip_tags and self.skip:
                          self.skip_depth -= 1
                          if self.skip_depth <= 0:
                              self.skip = False
                              self.skip_depth = 0
                          return

                      if self.skip:
                          return

                      if self.tag_stack and self.tag_stack[-1] == tag:
                          self.tag_stack.pop()

                      if tag in ('h1', 'h2', 'h3', 'h4', 'h5', 'h6'):
                          self._flush_line()

                      elif tag == 'a' and self.in_link:
                          text = self.link_text.strip()
                          if text and self.link_href:
                              self.link_counter += 1
                              ref = self.link_counter
                              self.links[ref] = self.link_href
                              self.current_line += f'>{ref}[{text}]'
                          elif text:
                              self.current_line += text
                          self.in_link = False
                          self.link_text = ''
                          self.link_href = ''

                      elif tag in ('p', 'div', 'section', 'article', 'main', 'blockquote'):
                          self._flush_line()

                      elif tag == 'li':
                          self._flush_line()
                          self.in_list_item = False

                      elif tag in ('ol', 'ul'):
                          self._flush_line()

                  def handle_data(self, data):
                      if self.skip:
                          return
                      # Collapse whitespace within text runs
                      text = re.sub(r'\s+', ' ', data)
                      if self.in_link:
                          self.link_text += text
                      else:
                          self.current_line += text

                  def handle_entityref(self, name):
                      entities = {'amp': '&', 'lt': '<', 'gt': '>', 'quot': '"',
                                  'apos': "'", 'nbsp': ' ', 'mdash': '-', 'ndash': '-',
                                  'laquo': '"', 'raquo': '"', 'ldquo': '"', 'rdquo': '"',
                                  'lsquo': "'", 'rsquo': "'"}
                      char = entities.get(name, f'&{name};')
                      if self.in_link:
                          self.link_text += char
                      elif not self.skip:
                          self.current_line += char

                  def handle_charref(self, name):
                      try:
                          if name.startswith('x'):
                              char = chr(int(name[1:], 16))
                          else:
                              char = chr(int(name))
                      except (ValueError, OverflowError):
                          char = ''
                      if self.in_link:
                          self.link_text += char
                      elif not self.skip:
                          self.current_line += char

                  def get_result(self):
                      self._flush_line()
                      # Remove consecutive blank entries and excessive whitespace
                      lines = []
                      prev_blank = False
                      for line in self.output:
                          if not line:
                              if not prev_blank:
                                  lines.append('')
                              prev_blank = True
                          else:
                              lines.append(line)
                              prev_blank = False

                      # Append link references
                      if self.links:
                          lines.append('---')
                          for ref in sorted(self.links.keys()):
                              lines.append(f'>{ref} {self.links[ref]}')

                      return '\n'.join(lines)

              parser = ButterFiParser()
              try:
                  parser.feed(html)
              except Exception:
                  # If parsing fails, fall back to brutal strip
                  text = re.sub(r'<(script|style)[^>]*>.*?</\1>', '', html,
                                flags=re.DOTALL | re.IGNORECASE)
                  text = re.sub(r'<[^>]+>', ' ', text)
                  text = re.sub(r'\s+', ' ', text).strip()
                  return text

              return parser.get_result()


          # ── Content policy (per-school allowlist / blocklist) ──────────────
          # Domains live in the POLICY_TABLE DynamoDB table, edited with
          # scripts/manage-policy.py. Decision order for a user-navigable URL:
          #   1. host on the BLOCK list                -> deny (block always wins)
          #   2. ALLOW list non-empty and host not on it -> deny (allow-only mode)
          #   3. otherwise                             -> allow
          # An empty table = open web (the default). Lists are cached for a short
          # TTL so we don't hit DynamoDB per fetch; a warm container keeps the
          # last-known-good list if a refresh fails. With no list to go on (cold
          # start + read error) it fails CLOSED: an allow-only school must never
          # get the open web because a DynamoDB read failed.
          _POLICY_TTL_SECONDS = 60
          _policy_cache = {'ts': 0.0, 'allow': None, 'block': None}
          POLICY_UNAVAILABLE_MSG = (
              "Your school's site list could not be checked just now, so this "
              "page was not opened. Try again in a minute.")


          class PolicyUnavailable(Exception):
              """The policy table couldn't be read and there is no cached copy."""


          def _query_policy_list(list_type):
              table = dynamodb.Table(POLICY_TABLE)
              domains = []
              kwargs = {
                  'KeyConditionExpression': 'listType = :t',
                  'ExpressionAttributeValues': {':t': list_type},
                  'ProjectionExpression': '#d',
                  'ExpressionAttributeNames': {'#d': 'domain'},  # 'domain' is reserved
              }
              while True:
                  resp = table.query(**kwargs)
                  domains.extend(item['domain'] for item in resp.get('Items', []))
                  if 'LastEvaluatedKey' not in resp:
                      break
                  kwargs['ExclusiveStartKey'] = resp['LastEvaluatedKey']
              return domains


          def load_policy():
              """Return (allow, block) domain lists, cached. Empty when no policy
              table is set; last-known-good on a refresh failure. Raises
              PolicyUnavailable when the read fails and nothing is cached."""
              if not POLICY_TABLE:
                  return [], []
              now = time.time()
              if _policy_cache['allow'] is not None and now - _policy_cache['ts'] < _POLICY_TTL_SECONDS:
                  return _policy_cache['allow'], _policy_cache['block']
              try:
                  allow = _query_policy_list('ALLOW')
                  block = _query_policy_list('BLOCK')
                  _policy_cache.update(ts=now, allow=allow, block=block)
              except Exception as exc:
                  print(f'policy load failed: {exc}')
                  if _policy_cache['allow'] is None:
                      raise PolicyUnavailable() from exc  # fail closed
              return _policy_cache['allow'], _policy_cache['block']


          def _host_on_list(host, domains):
              """True if host equals or is a subdomain of any listed domain."""
              host = (host or '').lower().rstrip('.')
              for d in domains:
                  d = (d or '').lower().strip().rstrip('.')
                  if d and (host == d or host.endswith('.' + d)):
                      return True
              return False


          def is_url_permitted(url):
              """Apply the school's allowlist/blocklist to a user-navigable URL.
              Returns (ok, user_facing_message)."""
              try:
                  allow, block = load_policy()
              except PolicyUnavailable:
                  return False, POLICY_UNAVAILABLE_MSG
              host = urllib.parse.urlparse(url).hostname or ''
              if _host_on_list(host, block):
                  return False, "This site is blocked by your school's content policy."
              if allow and not _host_on_list(host, allow):
                  return False, "This site isn't on your school's list of allowed sites."
              return True, 'ok'


          def is_safe_fetch_url(url):
              """SSRF guard: allow only http/https to publicly-routable hosts.

              The scraper fetches user-controlled URLs, so without this a query
              like http://169.254.169.254/... or http://localhost/... would turn
              it into an open proxy into internal networks / the metadata service.
              This is the pre-flight check that gives a readable reason; the real
              enforcement is the connection itself, which re-resolves through
              resolve_public and connects only to the addresses it vetted."""
              try:
                  parsed = urllib.parse.urlparse(url)
              except Exception:
                  return False, 'unparseable address'
              if parsed.scheme not in ('http', 'https'):
                  return False, f'scheme not allowed: {parsed.scheme or "(none)"}'
              host = parsed.hostname
              if not host:
                  return False, 'missing host'
              try:
                  parsed.port  # raises ValueError for a malformed port
                  resolve_public(host)
              except ValueError:
                  return False, 'bad port number'
              except FetchBlocked as exc:
                  return False, str(exc)
              return True, 'ok'


          class _SSRFGuardedRedirect(urllib.request.HTTPRedirectHandler):
              """Re-run the SSRF guard on every redirect hop — a public page must
              not be able to bounce the fetch to an internal address."""
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  allowed, reason = is_safe_fetch_url(newurl)
                  if not allowed:
                      raise urllib.error.URLError(f'blocked redirect: {reason}')
                  # A redirect must not bounce past the school's content policy.
                  permitted, _ = is_url_permitted(newurl)
                  if not permitted:
                      raise urllib.error.URLError('blocked redirect: content policy')
                  return super().redirect_request(req, fp, code, msg, headers, newurl)


          SEARCH_URL = 'https://lite.duckduckgo.com/lite/?q='
          # When DuckDuckGo suspects a bot it answers 202 with an "anomaly" page
          # ("Select all squares containing a duck") instead of results. Long,
          # sentence-like queries (a pasted headline) trigger it; short keyword
          # searches from the same address still work. So retry once with the
          # first few words, and if that is challenged too, say so plainly
          # instead of rendering the stripped challenge ("DuckDuckGo").
          SEARCH_RETRY_WORDS = 5
          SEARCH_CHALLENGED_MSG = (
              'The search engine (DuckDuckGo) stopped this search to check it '
              'was not a robot, and ButterFi cannot answer that check.\n\n'
              'Try a shorter search with just a few key words, or try again '
              'in a few minutes.'
          )


          # Only pages the text converter can use are downloaded. Anything else (a
          # PDF, an image, a video, a zip) is refused from its Content-Type before
          # the body is read. The body is read up to a cap, and within the fetch
          # timeout overall: the converter and the 255-chunk budget can't use more,
          # and an unbounded read of a large download could exhaust the Lambda's
          # memory. A page cut at the cap still renders its first part.
          FETCH_TEXT_TYPES = ('text/html', 'application/xhtml+xml', 'text/plain')
          FETCH_MAX_BYTES = 3 * 1024 * 1024
          FETCH_READ_BLOCK = 64 * 1024
          _TYPE_NAMES = {'application/pdf': 'a PDF file'}


          def _read_capped(resp, limit, deadline):
              """Up to limit bytes of the body, stopping early at the deadline."""
              parts, size = [], 0
              while size < limit and time.monotonic() < deadline:
                  block = resp.read(min(FETCH_READ_BLOCK, limit - size))
                  if not block:
                      break
                  parts.append(block)
                  size += len(block)
              if size >= limit:
                  print(f'fetch body cut at {limit} bytes')
              elif time.monotonic() >= deadline:
                  print(f'fetch body cut at {size} bytes (deadline)')
              return b''.join(parts)


          def _fetch(url, timeout):
              """GET url through the SSRF-guarded opener -> (status, final_url, html).
              Raises FetchBlocked for a non-public address, an unreachable safety
              filter, or a response that isn't a text page."""
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'ButterFi/1.0 (educational-access-bridge)'
              })
              # Pinned handlers replace urllib's default HTTP(S) handlers; the empty
              # ProxyHandler ignores any proxy environment variables.
              opener = urllib.request.build_opener(
                  urllib.request.ProxyHandler({}), _PinnedHTTPHandler,
                  _PinnedHTTPSHandler, _SSRFGuardedRedirect)
              # opener.open (not urllib.request.urlopen) so the redirect guard
              # applies; the initial URL is validated by is_safe_fetch_url.
              deadline = time.monotonic() + timeout
              with opener.open(req, timeout=timeout) as resp:
                  ctype = resp.headers.get_content_type()  # 'text/plain' if absent
                  if ctype not in FETCH_TEXT_TYPES:
                      kind = _TYPE_NAMES.get(ctype, f'a file ({ctype})')
                      raise FetchBlocked(f'it is {kind}, not a web page ButterFi can show')
                  body = _read_capped(resp, FETCH_MAX_BYTES, deadline)
                  return resp.status, resp.url, body.decode('utf-8', errors='replace')


          def _is_search_challenge(status, html):
              return status == 202 or 'anomaly-modal' in html


          def search(query):
              """DuckDuckGo Lite search with challenge handling -> ButterFi markup."""
              allowed, reason = is_safe_fetch_url(SEARCH_URL)
              if not allowed:
                  return f'Search is unavailable ({reason}).'
              try:
                  status, final_url, html = _fetch(
                      SEARCH_URL + urllib.request.quote(query), timeout=15)
                  if _is_search_challenge(status, html):
                      words = query.split()
                      if len(words) <= SEARCH_RETRY_WORDS:
                          print('search challenged (short query, no retry)')
                          return SEARCH_CHALLENGED_MSG
                      short = ' '.join(words[:SEARCH_RETRY_WORDS])
                      status, final_url, html = _fetch(
                          SEARCH_URL + urllib.request.quote(short), timeout=8)
                      if _is_search_challenge(status, html):
                          print('search challenged twice (long query, retried short)')
                          return SEARCH_CHALLENGED_MSG
                      print('search challenged; shortened retry succeeded')
                      return (f'(Search shortened to: {short})\n\n'
                              + html_to_butterfi(html, source_url=final_url))
                  return html_to_butterfi(html, source_url=final_url)
              except Exception as e:
                  return f'Search failed: {str(e)}. Try again in a minute.'


          def fetch_and_extract(query):
              """Fetch URL or search, return ButterFi markup."""
              q = query.strip()
              if q.startswith('http://') or q.startswith('https://'):
                  url = unwrap_ddg_redirect(q)  # a DDG /l/ wrapper -> real page
              elif ' ' not in q and BARE_DOMAIN.match(q):
                  url = 'https://' + q  # bare domain -> fetch, don't search
              else:
                  # DuckDuckGo's /html route now falls back to a generic landing
                  # page for this scraper UA; /lite still returns actual results.
                  # The search request is the tool's own, so it is not checked
                  # against the school's content policy; each result is checked
                  # when the student opens it (it comes back as a URL query).
                  return search(q)

              # SSRF guard: validate the scheme + resolved host before fetching,
              # and re-check every redirect (via the opener in _fetch).
              allowed, reason = is_safe_fetch_url(url)
              if not allowed:
                  return f'Cannot open that address ({reason}).'

              # School content policy — applies to user-navigable pages.
              permitted, message = is_url_permitted(url)
              if not permitted:
                  return message

              try:
                  _, final_url, html = _fetch(url, timeout=15)
                  return html_to_butterfi(html, source_url=final_url)
              except FetchBlocked as e:
                  return f'Cannot open that address ({e}).'
              except Exception as e:
                  return f'Error fetching content: {str(e)}'


          def chunk_text(text, max_bytes):
              """Split text into UTF-8 byte chunks, respecting character boundaries."""
              encoded = text.encode('utf-8')
              chunks = []
              offset = 0
              while offset < len(encoded):
                  end = offset + max_bytes
                  if end >= len(encoded):
                      chunks.append(encoded[offset:])
                  else:
                      # Back up to avoid splitting a multi-byte UTF-8 character
                      while end > offset and (encoded[end] & 0xC0) == 0x80:
                          end -= 1
                      chunks.append(encoded[offset:end])
                  offset = end
              return chunks


          # Response payload format (byte 0): 0x00 = plain UTF-8, 0x01 = gzip,
          # 0x02 = brotli. The device relays these bytes opaquely; the browser
          # reassembles every chunk, reads byte 0, and decodes once.
          RESP_FORMAT_PLAIN = 0x00
          RESP_FORMAT_GZIP = 0x01
          RESP_FORMAT_BROTLI = 0x02
          RESP_FORMAT_NAMES = {RESP_FORMAT_PLAIN: 'plain', RESP_FORMAT_GZIP: 'gzip',
                               RESP_FORMAT_BROTLI: 'brotli'}


          def chunk_bytes(data, max_bytes):
              """Split an opaque byte payload into fixed-size chunks."""
              if not data:
                  return [b'']
              return [data[i:i + max_bytes] for i in range(0, len(data), max_bytes)]


          def _cut_utf8(raw, n):
              """At most n bytes of raw, backed up so no UTF-8 char is split:
              while the first byte left out is a continuation byte, the cut is
              mid-character, so move it back to that character's start."""
              n = max(0, min(n, len(raw)))
              while 0 < n < len(raw) and (raw[n] & 0xC0) == 0x80:
                  n -= 1
              return raw[:n]


          def _compress_best(data):
              """(format, bytes) at full strength. Brotli 11 measured ~20% fewer
              chunks than gzip on real pages; its built-in English/web dictionary
              suits short text. Gzip only when the layer isn't there."""
              if brotli is not None:
                  return RESP_FORMAT_BROTLI, brotli.compress(data, quality=11)
              return RESP_FORMAT_GZIP, gzip.compress(data, 9)


          def _compressed_size_fast(data):
              """Cheap size estimate for the truncation search. Brotli 9 is ~20x
              faster than 11 and a little larger, so it errs on the side of fitting."""
              if brotli is not None:
                  return len(brotli.compress(data, quality=9))
              return len(gzip.compress(data, 6))


          def build_response_payload(text, chunk_size):
              """Return the [format][data] byte payload to chunk and send.

              Compresses the ButterFi markup (brotli, or gzip without the layer)
              when that is smaller, else sends plain UTF-8. Fits within 255 chunks
              by truncating the SOURCE text and recompressing (a compressed stream
              can't be sliced); most pages fit without any truncation. The slow
              full-strength encoder runs at most twice, so a huge page stays well
              inside the Lambda timeout."""
              budget = chunk_size * 255 - 1  # -1 for the format byte
              raw = text.encode('utf-8')
              # Markup compresses well under 8x, so anything past budget*8 can't
              # be sent anyway; drop it before the encoders see it.
              src = _cut_utf8(raw, budget * 8)
              # Find how much source fits, using the fast estimate.
              for _ in range(8):
                  size = _compressed_size_fast(src)
                  if size <= budget:
                      break
                  src = _cut_utf8(src, int(len(src) * budget / size * 0.97))
              fmt, comp = _compress_best(src)
              # The estimate is conservative, so a truncated page usually has room
              # left at full strength: grow the cut once to use it.
              if len(src) < len(raw) and 0 < len(comp) < budget * 0.95:
                  grown = _cut_utf8(raw, int(len(src) * budget / len(comp) * 0.97))
                  gfmt, gcomp = _compress_best(grown)
                  if len(gcomp) <= budget:
                      src, fmt, comp = grown, gfmt, gcomp
              # Guard: if full strength somehow came out bigger than the estimate.
              for _ in range(4):
                  if len(comp) <= budget:
                      break
                  src = _cut_utf8(src, int(len(src) * 0.9))
                  fmt, comp = _compress_best(src)
              if len(comp) <= budget and len(comp) < len(src):
                  return bytes([fmt]) + comp
              # Plain: incompressible (tiny) text, or the fallback hard truncation.
              return bytes([RESP_FORMAT_PLAIN]) + _cut_utf8(raw, budget)


          # Every downlink needs a fresh Sidewalk Seq. The device's duplicate filter
          # drops a message whose Seq matches one of its ~10 most recent, silently
          # (no error on either side). Seq used to be the chunk index, which repeats
          # on every page and every resend: after a short page (Seq 0-4) the next
          # page's chunk 0 was dropped, and so was every retry. A per-device counter
          # in ChunkTable (chunkKey "seq", no ttl) hands out increasing values;
          # Sidewalk accepts 0-16383, so it wraps there.
          SEQ_KEY = 'seq'
          SEQ_MOD = 16384


          def reserve_seqs(table, device_id, n):
              resp = table.update_item(
                  Key={'deviceId': device_id, 'chunkKey': SEQ_KEY},
                  UpdateExpression='ADD seqCounter :n',
                  ExpressionAttributeValues={':n': n},
                  ReturnValues='UPDATED_NEW',
              )
              end = int(resp['Attributes']['seqCounter'])
              return [(end - n + i) % SEQ_MOD for i in range(n)]

          def send_downlink(device_id, request_id, chunk_idx, total_chunks, chunk_data, seq):
              """Send a single chunk as a Sidewalk downlink."""
              payload = bytes([0x81, request_id, chunk_idx, total_chunks]) + chunk_data
              payload_b64 = base64.b64encode(payload).decode('ascii')

              try:
                  iot_wireless.send_data_to_wireless_device(
                      Id=device_id,          # WirelessDeviceId (UUID), not SidewalkId
                      TransmitMode=0,  # 0 = best effort
                      PayloadData=payload_b64,
                      # Sidewalk downlinks require WirelessMetadata; without it
                      # SendDataToWirelessDevice fails ValidationException.
                      WirelessMetadata={
                          'Sidewalk': {
                              'Seq': seq,
                              'MessageType': 'CUSTOM_COMMAND_ID_NOTIFY'
                          }
                      }
                  )
                  print(f'Sent chunk {chunk_idx}/{total_chunks} to {device_id}')
              except Exception as e:
                  print(f'Downlink failed: {e}')


          def handler(event, context):
              table = dynamodb.Table(CHUNK_TABLE)
              ttl_epoch = int(time.time()) + (CHUNK_TTL * 3600)

              for record in event['Records']:
                  msg = json.loads(record['body'])
                  device_id = msg['deviceId']
                  request_id = msg['requestId']
                  query = msg['query']

                  # Privacy: log metadata only, never the query/URL text itself.
                  print(f'Scraping for device={device_id} req={request_id} qlen={len(query)}')

                  # Fetch and extract text
                  text = fetch_and_extract(query)

                  # Compress (brotli, or gzip without the layer) behind a 1-byte
                  # format header, then chunk the opaque bytes. Fits within 255
                  # chunks. The device relays the bytes; the browser reads the
                  # header and decodes. 3-4x fewer downlink chunks than plain text.
                  payload = build_response_payload(text, TEXT_CHUNK_SIZE)
                  chunks = chunk_bytes(payload, TEXT_CHUNK_SIZE)
                  total = min(len(chunks), 255)

                  fmt = RESP_FORMAT_NAMES.get(payload[0], 'unknown')
                  print(f'Generated {total} chunks ({len(payload)}B {fmt}) from {len(text)} chars')

                  # A reused request_id (browse.js resets its counter to 1 on
                  # reload) would collide with a previous transfer's chunks in
                  # DynamoDB, corrupting `total` and leaving orphans. Clear this
                  # request_id's chunks first.
                  stale = table.query(
                      KeyConditionExpression='deviceId = :d AND begins_with(chunkKey, :p)',
                      ExpressionAttributeValues={':d': device_id, ':p': f'{request_id:03d}#'},
                      ProjectionExpression='chunkKey'
                  )
                  with table.batch_writer() as batch:
                      for it in stale.get('Items', []):
                          batch.delete_item(Key={'deviceId': device_id, 'chunkKey': it['chunkKey']})

                  # Store all chunks in DynamoDB
                  with table.batch_writer() as batch:
                      for i, chunk in enumerate(chunks[:255]):
                          batch.put_item(Item={
                              'deviceId': device_id,
                              'chunkKey': f'{request_id:03d}#{i:04d}',
                              'data': base64.b64encode(chunk).decode('ascii'),
                              'total': total,
                              'requestId': request_id,
                              # Privacy: the query is intentionally NOT stored. Chunks are
                              # keyed by deviceId + requestId#index, so delivery/resend never
                              # needs the search term labeling the content at rest.
                              'ttl': ttl_epoch
                          })

                  # Send first chunk immediately as downlink
                  if chunks:
                      send_downlink(device_id, request_id, 0, total, chunks[0],
                                    reserve_seqs(table, device_id, 1)[0])

              return {'statusCode': 200}

  ScraperEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ScrapeQueue.Arn
      FunctionName: !Ref ScraperLambda
      BatchSize: 1
      Enabled: true

  # ---------------------------------------------------------------
  # Lambda - Downlink handler (resends chunks on request)
  # ---------------------------------------------------------------
  DownlinkLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt DownlinkLambdaRole.Arn
      Timeout: 15
      MemorySize: 128
      Environment:
        Variables:
          CHUNK_TABLE: !Ref ChunkTable
      Code:
        ZipFile: |
          """
          ButterFi Downlink Handler
          
          Triggered via IoT Rule when a device requests chunk resend.
          Queries DynamoDB for stored chunks and sends them as downlinks.
          
          The device requests more data by sending:
            type=0x02, requestId, body=<next needed chunk index>
          """
          import json
          import os
          import base64
          import time
          import boto3

          dynamodb = boto3.resource('dynamodb')
          iot_wireless = boto3.client('iotwireless')

          CHUNK_TABLE = os.environ['CHUNK_TABLE']

          # Chunks sent per resend request. Kept at 3 until bigger batches are
          # proven safe on a link that is reconnecting. AWS documents no
          # per-device Sidewalk downlink limit; the API limit is
          # SendDataToWirelessDevice at 10 TPS per account (adjustable).
          # Measured 2026-11-21 over one BLE gateway: on a link that was already
          # up, bursts of 3, 6, 10 and 15 back-to-back downlinks all arrived
          # (34/34). But a page load at 10 per batch whose first burst landed
          # just as the idle link was reconnecting dropped the BLE link
          # mid-burst. It then churned through ~1 s connections, and after that
          # the gateway (an Echo Show inches away) stopped connecting to the
          # dongle at all: 55 min, through two dongle reboots, until the Echo
          # itself was restarted. Seen once and not proven causal, but a
          # student can't restart a neighbor's gateway, so bigger bursts stay
          # off until they're shown to be safe. At 3 a 46-chunk page took
          # 91.5 s (16 resends) with the link up throughout. A throttled send
          # (several students at once) backs off and retries instead of
          # ending the batch.
          RESEND_BATCH = 3
          THROTTLE_RETRY_DELAYS_S = (0.25, 0.5, 1.0)
          # Total time one invocation may spend backing off. Stays well inside the
          # 15 s timeout: an async invoke that times out is retried by Lambda,
          # which would send the whole batch again.
          RETRY_BUDGET_S = 5.0


          def _is_throttle(exc):
              code = getattr(exc, 'response', {}).get('Error', {}).get('Code', '')
              return code in ('ThrottlingException', 'TooManyRequestsException')


          def send_with_retry(device_id, payload, seq, deadline):
              """One downlink; retried with backoff only when the API throttles,
              and only while the invocation's retry deadline allows."""
              for delay in THROTTLE_RETRY_DELAYS_S + (None,):
                  try:
                      return iot_wireless.send_data_to_wireless_device(
                          Id=device_id,      # WirelessDeviceId (UUID) from the resend topic
                          TransmitMode=0,
                          PayloadData=base64.b64encode(payload).decode('ascii'),
                          # Sidewalk downlinks require WirelessMetadata (see scraper).
                          WirelessMetadata={
                              'Sidewalk': {
                                  'Seq': seq,
                                  'MessageType': 'CUSTOM_COMMAND_ID_NOTIFY'
                              }
                          }
                      )
                  except Exception as exc:
                      if (delay is None or not _is_throttle(exc)
                              or time.monotonic() + delay > deadline):
                          raise
                      print(f'throttled; retrying in {delay}s')
                      time.sleep(delay)


          # Every downlink needs a fresh Sidewalk Seq. The device's duplicate filter
          # drops a message whose Seq matches one of its ~10 most recent, silently
          # (no error on either side). Seq used to be the chunk index, which repeats
          # on every page and every resend: after a short page (Seq 0-4) the next
          # page's chunk 0 was dropped, and so was every retry. A per-device counter
          # in ChunkTable (chunkKey "seq", no ttl) hands out increasing values;
          # Sidewalk accepts 0-16383, so it wraps there.
          SEQ_KEY = 'seq'
          SEQ_MOD = 16384


          def reserve_seqs(table, device_id, n):
              resp = table.update_item(
                  Key={'deviceId': device_id, 'chunkKey': SEQ_KEY},
                  UpdateExpression='ADD seqCounter :n',
                  ExpressionAttributeValues={':n': n},
                  ReturnValues='UPDATED_NEW',
              )
              end = int(resp['Attributes']['seqCounter'])
              return [(end - n + i) % SEQ_MOD for i in range(n)]


          def handler(event, context):
              print(json.dumps(event))

              device_id = event.get('deviceId', '')
              request_id = int(event.get('requestId', 0))
              start_idx = int(event.get('startIdx', 0))

              if not device_id:
                  return {'statusCode': 400}

              table = dynamodb.Table(CHUNK_TABLE)

              # Query chunks for this device + request
              response = table.query(
                  KeyConditionExpression='deviceId = :did AND begins_with(chunkKey, :prefix)',
                  ExpressionAttributeValues={
                      ':did': device_id,
                      ':prefix': f'{request_id:03d}#'
                  }
              )

              items = sorted(response.get('Items', []), key=lambda x: x['chunkKey'])

              if not items:
                  print(f'No chunks found for {device_id} req={request_id}')
                  return {'statusCode': 404}

              total = int(items[0].get('total', len(items)))  # DynamoDB numbers read as Decimal

              # Send the next RESEND_BATCH chunks from the requested index; the
              # browser asks again from its first missing chunk when they stop.
              sent = 0
              batch = [it for it in items
                       if int(it['chunkKey'].split('#')[1]) >= start_idx][:RESEND_BATCH]
              seqs = reserve_seqs(table, device_id, len(batch)) if batch else []
              deadline = time.monotonic() + RETRY_BUDGET_S

              for item, seq in zip(batch, seqs):
                  idx = int(item['chunkKey'].split('#')[1])
                  chunk_data = base64.b64decode(item['data'])
                  payload = bytes([0x81, request_id, idx, total]) + chunk_data
                  try:
                      send_with_retry(device_id, payload, seq, deadline)
                      print(f'Resent chunk {idx}/{total} to {device_id}')
                      sent += 1
                  except Exception as e:
                      print(f'Downlink failed for chunk {idx}: {e}')
                      break

              return {'statusCode': 200, 'sent': sent}

  # ---------------------------------------------------------------
  # IoT Core - Sidewalk destination and rules
  # ---------------------------------------------------------------
  SidewalkDestination:
    Type: Custom::IoTWirelessDestination
    DependsOn:
      - SidewalkUplinkRule
    Properties:
      ServiceToken: !GetAtt DestinationManagerLambda.Arn
      Name: !Ref SidewalkDestinationName
      # MqttTopic delivery: IoT Wireless publishes each uplink to the topic the
      # SidewalkUplinkRule listens on ('butterfi/uplink'). This is the path
      # verified end-to-end. (RuleName delivery to !Ref SidewalkUplinkRule also
      # needs the role's iot:DescribeEndpoint permission added above; it was the
      # original value but was not re-verified after the permission fix.)
      Expression: butterfi/uplink
      ExpressionType: MqttTopic
      RoleArn: !GetAtt SidewalkRuleRole.Arn
      Description: Routes ButterFi Sidewalk uplinks to processing Lambda
      Region: !Ref AWS::Region
      AccountId: !Ref AWS::AccountId

  SidewalkUplinkRule:
    Type: AWS::IoT::TopicRule
    Properties:
      TopicRulePayload:
        Sql: "SELECT * FROM 'butterfi/uplink'"
        Actions:
          - Lambda:
              FunctionArn: !GetAtt UplinkLambda.Arn
        ErrorAction:
          CloudwatchLogs:
            LogGroupName: !Ref UplinkErrorLogGroup
            RoleArn: !GetAtt SidewalkRuleRole.Arn
        RuleDisabled: false

  # Resend rule - triggers downlink lambda when device requests chunks
  ResendRule:
    Type: AWS::IoT::TopicRule
    Properties:
      TopicRulePayload:
        Sql: "SELECT * FROM 'butterfi/resend/+'"
        Actions:
          - Lambda:
              FunctionArn: !GetAtt DownlinkLambda.Arn
        RuleDisabled: false

  DownlinkLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DownlinkLambda
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !GetAtt ResendRule.Arn

  # ---------------------------------------------------------------
  # CloudWatch - Logging and monitoring
  # ---------------------------------------------------------------
  UplinkErrorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7

  UplinkLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${UplinkLambda}
      RetentionInDays: 7

  ScraperLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ScraperLambda}
      RetentionInDays: 7

  DownlinkLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${DownlinkLambda}
      RetentionInDays: 7

  # ---------------------------------------------------------------
  # CloudWatch - Alarms for operational visibility
  # ---------------------------------------------------------------
  DLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Messages in the dead letter queue indicate scrape failures
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ScrapeDeadLetterQueue.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ScraperErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Scraper Lambda invocation errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ScraperLambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  SidewalkDestinationName:
    Description: Sidewalk destination name - use when provisioning devices
    Value: !Ref SidewalkDestinationName

  ScrapeQueueUrl:
    Description: SQS queue URL for scrape jobs
    Value: !Ref ScrapeQueue

  ChunkTableName:
    Description: DynamoDB table for response chunks
    Value: !Ref ChunkTable

  PolicyTableName:
    Description: DynamoDB table for the content allowlist/blocklist (use with scripts/manage-policy.py)
    Value: !Ref PolicyTable

  UplinkLambdaArn:
    Description: Uplink handler Lambda ARN
    Value: !GetAtt UplinkLambda.Arn

  ScraperLambdaArn:
    Description: Scraper Lambda ARN
    Value: !GetAtt ScraperLambda.Arn

  DownlinkLambdaArn:
    Description: Downlink handler Lambda ARN
    Value: !GetAtt DownlinkLambda.Arn

  DeployCommand:
    Description: >-
      Redeploy from the CLI. The template is over the 51,200-byte direct-upload
      limit, so it's staged in a us-east-1 S3 bucket you own.
    Value: >
      aws cloudformation deploy
      --template-file template.yaml
      --s3-bucket <your-us-east-1-bucket>
      --stack-name butterfi
      --capabilities CAPABILITY_NAMED_IAM
      --region us-east-1
