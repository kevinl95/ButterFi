AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ButterFi - Sidewalk-to-Web bridge for students without home internet.
  Receives text queries over Amazon Sidewalk, scrapes/summarizes web content,
  and returns chunked responses sized for Sidewalk's constrained payloads.

Parameters:
  SidewalkDestinationName:
    Type: String
    Default: ButterFiDestination
    Description: Name for the Sidewalk device destination

  MaxChunkBytes:
    Type: Number
    Default: 240
    Description: >
      Max payload bytes per downlink chunk. Sidewalk FSK supports 250 bytes,
      but we reserve 10 bytes for chunk headers (sequence number, total chunks, flags).

  ScraperTimeoutSeconds:
    Type: Number
    Default: 30
    Description: Timeout for the scraper Lambda

  ChunkTTLHours:
    Type: Number
    Default: 24
    Description: Hours to keep chunked responses in DynamoDB before TTL expiry

Resources:

  # ---------------------------------------------------------------
  # DynamoDB - Chunk store for multi-message responses
  # ---------------------------------------------------------------
  ChunkTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: deviceId
          AttributeType: S
        - AttributeName: chunkKey
          AttributeType: S
      KeySchema:
        - AttributeName: deviceId
          KeyType: HASH
        - AttributeName: chunkKey
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: ButterFi

  # ---------------------------------------------------------------
  # SQS - Decouple scraping from chunk delivery
  # ---------------------------------------------------------------
  ScrapeQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 60
      MessageRetentionPeriod: 3600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ScrapeDeadLetterQueue.Arn
        maxReceiveCount: 3

  ScrapeDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 86400

  # ---------------------------------------------------------------
  # IAM - Lambda execution roles
  # ---------------------------------------------------------------
  UplinkLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ButterFiUplinkPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt ScrapeQueue.Arn
              - Effect: Allow
                Action:
                  - iot:Publish
                Resource: !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/butterfi/resend/*'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt ChunkTable.Arn

  ScraperLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ButterFiScraperPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ScrapeQueue.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:Query
                Resource: !GetAtt ChunkTable.Arn
              - Effect: Allow
                Action:
                  - iot:Publish
                Resource: !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/butterfi/*'
              - Effect: Allow
                Action:
                  - iotwireless:SendDataToWirelessDevice
                Resource: '*'

  DownlinkLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ButterFiDownlinkPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:GetItem
                Resource: !GetAtt ChunkTable.Arn
              - Effect: Allow
                Action:
                  - iotwireless:SendDataToWirelessDevice
                Resource: '*'

  SidewalkRuleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              # iotwireless assumes this role to deliver Sidewalk uplinks to the
              # destination; iot is for the topic-rule Lambda action.
              Service:
                - iot.amazonaws.com
                - iotwireless.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ButterFiIoTRulePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt UplinkLambda.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              # IoT Wireless assumes this role to deliver each Sidewalk uplink to
              # the destination: it calls iot:DescribeEndpoint to find the data
              # endpoint, then iot:Publish to the destination topic. Without
              # DescribeEndpoint the delivery 403s and the uplink silently never
              # reaches the rule (diagnosable only via Network Analyzer).
              - Effect: Allow
                Action:
                  - iot:DescribeEndpoint
                Resource: '*'
              - Effect: Allow
                Action:
                  - iot:Publish
                Resource: !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/butterfi/uplink'

  DestinationManagerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ButterFiDestinationManagerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iotwireless:CreateDestination
                  - iotwireless:UpdateDestination
                  - iotwireless:DeleteDestination
                  - iotwireless:GetDestination
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt SidewalkRuleRole.Arn

  DestinationManagerLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt DestinationManagerLambdaRole.Arn
      Timeout: 60
      MemorySize: 128
      Code:
        ZipFile: |
          import json
          import os
          import urllib.request
          import boto3
          from botocore.exceptions import ClientError, EndpointConnectionError

          SUPPORTED_REGIONS = set(boto3.session.Session().get_available_regions('iotwireless'))

          def get_client(props):
              region = props.get('Region') or os.environ.get('AWS_REGION')
              return boto3.client('iotwireless', region_name=region)

          def send_response(event, context, status, data, physical_resource_id=None, reason=None):
              body = {
                  'Status': status,
                  'Reason': reason or f'See CloudWatch Log Stream: {context.log_stream_name}',
                  'PhysicalResourceId': physical_resource_id or context.log_stream_name,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data,
              }
              request = urllib.request.Request(
                  event['ResponseURL'],
                  data=json.dumps(body).encode('utf-8'),
                  method='PUT',
                  headers={'content-type': ''},
              )
              # nosec B310 - ResponseURL is the CloudFormation-provided pre-signed
              # S3 callback URL, not user input; this is the standard custom-resource
              # response and never fetches an attacker-controlled address.
              with urllib.request.urlopen(request):  # nosec B310
                  return

          def destination_arn(name, event):
              return f"arn:aws:iotwireless:{event['ResourceProperties']['Region']}:{event['ResourceProperties']['AccountId']}:destination/{name}"

          def create_destination(props, event):
              client = get_client(props)
              client.create_destination(
                  Name=props['Name'],
                  ExpressionType=props['ExpressionType'],
                  Expression=props['Expression'],
                  Description=props.get('Description', ''),
                  RoleArn=props['RoleArn'],
              )
              return props['Name']

          def update_destination(props, old_props, event):
              new_name = props['Name']
              old_name = old_props['Name']
              client = get_client(props)

              if new_name != old_name:
                  create_destination(props, event)
                  try:
                      client.delete_destination(Name=old_name)
                  except ClientError as exc:
                      if exc.response['Error']['Code'] != 'ResourceNotFoundException':
                          raise
                  return new_name

              client.update_destination(
                  Name=new_name,
                  ExpressionType=props['ExpressionType'],
                  Expression=props['Expression'],
                  Description=props.get('Description', ''),
                  RoleArn=props['RoleArn'],
              )
              return new_name

          def delete_destination(name):
              client = boto3.client('iotwireless', region_name=os.environ.get('AWS_REGION'))
              try:
                  client.delete_destination(Name=name)
              except ClientError as exc:
                  if exc.response['Error']['Code'] != 'ResourceNotFoundException':
                      raise

          def handler(event, context):
              props = event['ResourceProperties']
              request_type = event['RequestType']
              region = props.get('Region') or os.environ.get('AWS_REGION')

              try:
                  if region not in SUPPORTED_REGIONS:
                      raise ValueError(
                          'IoT Wireless destinations are not available in '
                          f'{region}. Deploy this stack in a supported region such as '
                          f'{", ".join(sorted(SUPPORTED_REGIONS))}.'
                      )

                  if request_type == 'Create':
                      name = create_destination(props, event)
                  elif request_type == 'Update':
                      name = update_destination(props, event['OldResourceProperties'], event)
                  elif request_type == 'Delete':
                      name = event.get('PhysicalResourceId', props['Name'])
                      delete_destination(name)
                  else:
                      raise ValueError(f'Unsupported request type: {request_type}')

                  send_response(
                      event,
                      context,
                      'SUCCESS',
                      {
                          'Name': name,
                          'Arn': destination_arn(name, event),
                      },
                      physical_resource_id=name,
                  )
              except EndpointConnectionError:
                      send_response(
                      event,
                      context,
                      'FAILED',
                      {
                          'Error': (
                            f'IoT Wireless endpoint is unavailable in {region}. '
                              f'Deploy this stack in a supported region such as {", ".join(sorted(SUPPORTED_REGIONS))}.'
                          )
                      },
                      physical_resource_id=event.get('PhysicalResourceId', props.get('Name', context.log_stream_name)),
                      reason=(
                          f'IoT Wireless endpoint is unavailable in {region}. '
                          f'Deploy this stack in a supported region such as {", ".join(sorted(SUPPORTED_REGIONS))}.'
                      )
                  )
              except Exception as exc:
                  send_response(
                      event,
                      context,
                      'FAILED',
                      {'Error': str(exc)},
                      physical_resource_id=event.get('PhysicalResourceId', props.get('Name', context.log_stream_name)),
                      reason=str(exc),
                  )

  # ---------------------------------------------------------------
  # Lambda - Uplink handler (receives Sidewalk messages)
  # ---------------------------------------------------------------
  UplinkLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt UplinkLambdaRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          SCRAPE_QUEUE_URL: !Ref ScrapeQueue
          CHUNK_TABLE: !Ref ChunkTable
      Code:
        ZipFile: |
          """
          ButterFi Uplink Handler
          
          Receives base64-encoded Sidewalk uplink payloads from IoT Core.
          Parses the query (URL or text search) and enqueues a scrape job.
          
          Uplink payload format (binary):
            byte 0:    message type (0x01 = query, 0x02 = chunk request, 0x03 = ack)
            byte 1:    request ID (rolling 0-255, used to correlate response chunks)
            byte 2..N: payload
              - type 0x01: query string (URL or search terms)
              - type 0x02: next needed chunk index as 1 byte
              - type 0x03: last received chunk index as 1 byte
          """
          import json
          import os
          import base64
          import boto3
          import time

          sqs = boto3.client('sqs')
          dynamodb = boto3.resource('dynamodb')

          QUEUE_URL = os.environ['SCRAPE_QUEUE_URL']
          TABLE = os.environ['CHUNK_TABLE']

          def handler(event, context):
              print(json.dumps(event))

              # IoT Core Sidewalk uplinks arrive with PayloadData (base64)
              payload_b64 = event.get('PayloadData', '')
              # Use the WirelessDeviceId (UUID) downstream: it is what
              # SendDataToWirelessDevice needs to address the downlink. The
              # Sidewalk SidewalkId (short hex) is only for reference/logging.
              device_id = event.get('WirelessDeviceId', 'unknown')
              sidewalk_id = event.get('WirelessMetadata', {}).get('Sidewalk', {}).get('SidewalkId', 'unknown')

              if not payload_b64:
                  print('No payload data')
                  return {'statusCode': 400}

              raw = base64.b64decode(payload_b64)
              # Amazon Sidewalk delivers the app payload hex-encoded: PayloadData
              # is the base64 of an ASCII hex string (e.g. b'0101687474...'), not
              # the raw bytes. Peel the hex layer; tolerate already-raw data.
              try:
                  raw = bytes.fromhex(raw.decode('ascii'))
              except (ValueError, UnicodeDecodeError):
                  pass
              if len(raw) < 2:
                  print(f'Payload too short: {len(raw)} bytes')
                  return {'statusCode': 400}

              msg_type = raw[0]
              request_id = raw[1]
              body = raw[2:]
              query = ''
              control_value = None

              if msg_type == 0x01:
                  if not body:
                      print('Query payload missing')
                      return {'statusCode': 400}
                  query = body.decode('utf-8', errors='replace')
              elif msg_type in (0x02, 0x03):
                  if len(body) != 1:
                      print(f'Invalid control payload length for type {msg_type:#x}: {len(body)}')
                      return {'statusCode': 400}
                  control_value = body[0]

              if msg_type == 0x01:
                  print(f'device={device_id} type={msg_type:#x} req={request_id} query={query}')
              elif msg_type in (0x02, 0x03):
                  print(f'device={device_id} type={msg_type:#x} req={request_id} value={control_value}')
              else:
                  print(f'device={device_id} type={msg_type:#x} req={request_id}')

              if msg_type == 0x01:  # New query
                  sqs.send_message(
                      QueueUrl=QUEUE_URL,
                      MessageBody=json.dumps({
                          'deviceId': device_id,
                          'requestId': request_id,
                          'query': query,
                          'timestamp': int(time.time())
                      })
                  )
                  return {'statusCode': 202}

              elif msg_type == 0x02:  # Re-request chunks
                  # Client is asking for chunks to be re-sent from the next
                  # needed chunk index; handled by the downlink lambda.
                  iot = boto3.client('iot-data')
                  iot.publish(
                      topic=f'butterfi/resend/{device_id}',
                      payload=json.dumps({
                          'deviceId': device_id,
                          'requestId': request_id,
                          'startIdx': control_value
                      })
                  )
                  return {'statusCode': 200}

              elif msg_type == 0x03:  # ACK
                  print(f'ACK from {device_id} for chunk {control_value}')
                  return {'statusCode': 200}

              return {'statusCode': 400, 'body': 'Unknown message type'}

  UplinkLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UplinkLambda
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !GetAtt SidewalkUplinkRule.Arn

  # ---------------------------------------------------------------
  # Lambda - Scraper (fetches pages, chunks, sends downlinks)
  # ---------------------------------------------------------------
  ScraperLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ScraperLambdaRole.Arn
      Timeout: !Ref ScraperTimeoutSeconds
      MemorySize: 256
      Environment:
        Variables:
          CHUNK_TABLE: !Ref ChunkTable
          MAX_CHUNK_BYTES: !Ref MaxChunkBytes
          CHUNK_TTL_HOURS: !Ref ChunkTTLHours
      Code:
        ZipFile: |
          """
          ButterFi Scraper
          
          Triggered by SQS. Fetches a URL or performs a search,
          strips HTML to plain text, chunks into Sidewalk-sized payloads,
          stores chunks in DynamoDB, and sends the first chunk as a downlink.
          
          Chunk storage format in DynamoDB:
            deviceId:  Sidewalk device ID (hash key)
            chunkKey:  "{requestId}#{chunkIndex:04d}" (range key)
            data:      base64-encoded chunk payload
            total:     total number of chunks
            ttl:       epoch expiry
          
          Downlink payload format (binary):
            byte 0:    message type (0x81 = response chunk)
            byte 1:    request ID
            byte 2:    chunk index (0-based)
            byte 3:    total chunks
            byte 4..N: UTF-8 text chunk
          """
          import json
          import os
          import base64
          import time
          import urllib.request
          import urllib.error
          import urllib.parse
          import re
          import socket
          import ipaddress
          import gzip
          import boto3

          # -------------------------------------------------------
          # Force DNS through Cloudflare for Families (1.1.1.3)
          # Blocks malware + adult content at the resolver level.
          # This is a safety net for student-facing infrastructure.
          # -------------------------------------------------------
          import ctypes
          try:
              _libc = ctypes.CDLL('libc.so.6')
          except OSError:
              _libc = None

          CF_FAMILIES_DNS = '1.1.1.3'
          CF_FAMILIES_DNS_ALT = '1.0.0.3'

          # A bare hostname like "cnn.com" or "text.npr.org/story" (no scheme)
          # should be fetched as a URL, not sent to search. Match one+ dotted
          # labels ending in a letters-only TLD, with an optional port/path.
          BARE_DOMAIN = re.compile(r'^(?:[a-z0-9-]+\.)+[a-z]{2,}(?:[:/?#].*)?$', re.I)

          _original_getaddrinfo = socket.getaddrinfo

          def _cf_getaddrinfo(host, port, family=0, type=0, proto=0, flags=0):
              """Resolve hostnames via Cloudflare for Families (1.1.1.3).
              Falls back to default resolver if CF is unreachable."""
              # Don't intercept IP literals or AWS service endpoints
              # (boto3 needs to reach AWS APIs without filtering)
              try:
                  socket.inet_aton(host)
                  return _original_getaddrinfo(host, port, family, type, proto, flags)
              except socket.error:
                  pass

              AWS_SUFFIXES = ('.amazonaws.com', '.aws.amazon.com', '.amazon.com')
              if any(host.endswith(s) for s in AWS_SUFFIXES):
                  return _original_getaddrinfo(host, port, family, type, proto, flags)

              # Resolve via Cloudflare for Families using system DNS-over-UDP
              import struct
              def _dns_query(name, dns_server, timeout=3):
                  """Minimal DNS A-record query."""
                  # Build DNS query packet
                  tx_id = os.urandom(2)
                  flags = b'\x01\x00'  # standard query, recursion desired
                  counts = b'\x00\x01\x00\x00\x00\x00\x00\x00'  # 1 question
                  qname = b''
                  for label in name.split('.'):
                      qname += bytes([len(label)]) + label.encode('ascii')
                  qname += b'\x00'
                  qtype = b'\x00\x01'   # A record
                  qclass = b'\x00\x01'  # IN class
                  packet = tx_id + flags + counts + qname + qtype + qclass

                  sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
                  sock.settimeout(timeout)
                  try:
                      sock.sendto(packet, (dns_server, 53))
                      resp, _ = sock.recvfrom(1024)
                  finally:
                      sock.close()

                  # Parse answer section (skip header + question)
                  # Header is 12 bytes, question is variable
                  offset = 12
                  # Skip question
                  while resp[offset] != 0:
                      offset += resp[offset] + 1
                  offset += 5  # null byte + qtype(2) + qclass(2)

                  # Read answers
                  ips = []
                  ancount = struct.unpack('!H', resp[6:8])[0]
                  for _ in range(ancount):
                      # Skip name (may be pointer)
                      if resp[offset] & 0xC0 == 0xC0:
                          offset += 2
                      else:
                          while resp[offset] != 0:
                              offset += resp[offset] + 1
                          offset += 1
                      rtype = struct.unpack('!H', resp[offset:offset+2])[0]
                      rdlen = struct.unpack('!H', resp[offset+8:offset+10])[0]
                      offset += 10
                      if rtype == 1 and rdlen == 4:  # A record
                          ips.append(socket.inet_ntoa(resp[offset:offset+4]))
                      offset += rdlen
                  return ips

              try:
                  ips = _dns_query(host, CF_FAMILIES_DNS)
                  if not ips:
                      ips = _dns_query(host, CF_FAMILIES_DNS_ALT)
              except Exception:
                  # Cloudflare unreachable — fall back to default
                  return _original_getaddrinfo(host, port, family, type, proto, flags)

              if not ips:
                  # Domain blocked by Cloudflare for Families or NXDOMAIN
                  raise socket.gaierror(f'DNS resolution blocked for {host} (Cloudflare for Families)')

              # Convert to getaddrinfo-style response
              results = []
              for ip in ips:
                  results.append((socket.AF_INET, socket.SOCK_STREAM, 6, '', (ip, port or 80)))
              return results

          # Monkey-patch socket.getaddrinfo globally for this Lambda
          socket.getaddrinfo = _cf_getaddrinfo

          dynamodb = boto3.resource('dynamodb')
          iot_wireless = boto3.client('iotwireless')

          CHUNK_TABLE = os.environ['CHUNK_TABLE']
          MAX_CHUNK = int(os.environ['MAX_CHUNK_BYTES'])
          CHUNK_TTL = int(os.environ['CHUNK_TTL_HOURS'])

          # Overhead: type(1) + requestId(1) + chunkIdx(1) + totalChunks(1) = 4 bytes
          TEXT_CHUNK_SIZE = MAX_CHUNK - 4


          def unwrap_ddg_redirect(url):
              """DuckDuckGo result links are tracking redirects of the form
              duckduckgo.com/l/?uddg=<percent-encoded-real-url>&rut=... The /l/
              redirector doesn't serve a fetchable page to this scraper (the
              fetch hangs), so return the real destination and fetch it directly.
              parse_qs already percent-decodes the value once, which is exactly
              right — the wrapper double-encodes the destination's own query."""
              try:
                  from urllib.parse import urlparse, parse_qs
                  parsed = urlparse(url)
                  host = parsed.netloc.lower()
                  is_ddg = host == 'duckduckgo.com' or host.endswith('.duckduckgo.com')
                  if is_ddg and parsed.path.rstrip('/') == '/l':
                      uddg = parse_qs(parsed.query).get('uddg')
                      if uddg and uddg[0].startswith(('http://', 'https://')):
                          return uddg[0]
              except Exception:
                  pass
              return url


          def html_to_butterfi(html, source_url=''):
              """Convert HTML to ButterFi markup — a compact, readable format
              that preserves document structure while minimizing byte count.

              ButterFi markup spec:
                #  Heading 1
                ## Heading 2
                ### Heading 3
                Regular paragraph text with >1[linked text] inline.
                - Unordered list item
                1. Ordered list item
                ---
                (separator)
                >1 https://example.com
                >2 https://other.com
                (link references collected at the end)

              The PWA renders these as interactive elements.
              Links use numbered references to keep inline text short.
              """
              from html.parser import HTMLParser

              class ButterFiParser(HTMLParser):
                  def __init__(self):
                      super().__init__()
                      self.output = []
                      self.links = {}        # ref_num -> url
                      self.link_counter = 0
                      self.tag_stack = []
                      self.current_line = ''
                      self.in_link = False
                      self.link_text = ''
                      self.link_href = ''
                      self.in_list_item = False
                      self.ordered_list_idx = 0
                      self.skip = False      # inside script/style/nav/footer
                      self.skip_depth = 0

                      # Tags whose content we discard entirely
                      self.skip_tags = {'script', 'style', 'nav', 'footer',
                                        'header', 'noscript', 'svg', 'form',
                                        'iframe', 'object', 'embed'}

                  def _flush_line(self):
                      line = self.current_line.strip()
                      if line:
                          self.output.append(line)
                      self.current_line = ''

                  def handle_starttag(self, tag, attrs):
                      attrs_dict = dict(attrs)
                      tag = tag.lower()

                      if tag in self.skip_tags:
                          self.skip = True
                          self.skip_depth += 1
                          return

                      if self.skip:
                          if tag in self.skip_tags:
                              self.skip_depth += 1
                          return

                      self.tag_stack.append(tag)

                      if tag in ('h1', 'h2', 'h3', 'h4', 'h5', 'h6'):
                          self._flush_line()
                          level = int(tag[1])
                          prefix = '#' * min(level, 3)
                          self.current_line = prefix + ' '

                      elif tag == 'a' and 'href' in attrs_dict:
                          href = attrs_dict['href']
                          # Skip fragment-only and javascript links
                          if href and not href.startswith('#') and not href.startswith('javascript:'):
                              self.in_link = True
                              self.link_text = ''
                              self.link_href = href
                              # Resolve relative URLs
                              if source_url and not href.startswith(('http://', 'https://')):
                                  from urllib.parse import urljoin
                                  self.link_href = urljoin(source_url, href)
                              # Unwrap DuckDuckGo tracking redirects to the real URL
                              self.link_href = unwrap_ddg_redirect(self.link_href)

                      elif tag == 'br':
                          self._flush_line()

                      elif tag in ('p', 'div', 'section', 'article', 'main', 'blockquote'):
                          self._flush_line()

                      elif tag == 'li':
                          self._flush_line()
                          self.in_list_item = True
                          # Check if parent is ol
                          if 'ol' in self.tag_stack:
                              self.ordered_list_idx += 1
                              self.current_line = f'{self.ordered_list_idx}. '
                          else:
                              self.current_line = '- '

                      elif tag == 'ol':
                          self._flush_line()
                          self.ordered_list_idx = 0

                      elif tag == 'ul':
                          self._flush_line()

                      elif tag == 'hr':
                          self._flush_line()
                          self.output.append('---')

                      elif tag == 'img':
                          alt = attrs_dict.get('alt', '')
                          if alt and len(alt) < 100:
                              self.current_line += f'[img: {alt}]'

                  def handle_endtag(self, tag):
                      tag = tag.lower()

                      if tag in self.skip_tags and self.skip:
                          self.skip_depth -= 1
                          if self.skip_depth <= 0:
                              self.skip = False
                              self.skip_depth = 0
                          return

                      if self.skip:
                          return

                      if self.tag_stack and self.tag_stack[-1] == tag:
                          self.tag_stack.pop()

                      if tag in ('h1', 'h2', 'h3', 'h4', 'h5', 'h6'):
                          self._flush_line()

                      elif tag == 'a' and self.in_link:
                          text = self.link_text.strip()
                          if text and self.link_href:
                              self.link_counter += 1
                              ref = self.link_counter
                              self.links[ref] = self.link_href
                              self.current_line += f'>{ref}[{text}]'
                          elif text:
                              self.current_line += text
                          self.in_link = False
                          self.link_text = ''
                          self.link_href = ''

                      elif tag in ('p', 'div', 'section', 'article', 'main', 'blockquote'):
                          self._flush_line()

                      elif tag == 'li':
                          self._flush_line()
                          self.in_list_item = False

                      elif tag in ('ol', 'ul'):
                          self._flush_line()

                  def handle_data(self, data):
                      if self.skip:
                          return
                      # Collapse whitespace within text runs
                      text = re.sub(r'\s+', ' ', data)
                      if self.in_link:
                          self.link_text += text
                      else:
                          self.current_line += text

                  def handle_entityref(self, name):
                      entities = {'amp': '&', 'lt': '<', 'gt': '>', 'quot': '"',
                                  'apos': "'", 'nbsp': ' ', 'mdash': '-', 'ndash': '-',
                                  'laquo': '"', 'raquo': '"', 'ldquo': '"', 'rdquo': '"',
                                  'lsquo': "'", 'rsquo': "'"}
                      char = entities.get(name, f'&{name};')
                      if self.in_link:
                          self.link_text += char
                      elif not self.skip:
                          self.current_line += char

                  def handle_charref(self, name):
                      try:
                          if name.startswith('x'):
                              char = chr(int(name[1:], 16))
                          else:
                              char = chr(int(name))
                      except (ValueError, OverflowError):
                          char = ''
                      if self.in_link:
                          self.link_text += char
                      elif not self.skip:
                          self.current_line += char

                  def get_result(self):
                      self._flush_line()
                      # Remove consecutive blank entries and excessive whitespace
                      lines = []
                      prev_blank = False
                      for line in self.output:
                          if not line:
                              if not prev_blank:
                                  lines.append('')
                              prev_blank = True
                          else:
                              lines.append(line)
                              prev_blank = False

                      # Append link references
                      if self.links:
                          lines.append('---')
                          for ref in sorted(self.links.keys()):
                              lines.append(f'>{ref} {self.links[ref]}')

                      return '\n'.join(lines)

              parser = ButterFiParser()
              try:
                  parser.feed(html)
              except Exception:
                  # If parsing fails, fall back to brutal strip
                  text = re.sub(r'<(script|style)[^>]*>.*?</\1>', '', html,
                                flags=re.DOTALL | re.IGNORECASE)
                  text = re.sub(r'<[^>]+>', ' ', text)
                  text = re.sub(r'\s+', ' ', text).strip()
                  return text

              return parser.get_result()


          def is_safe_fetch_url(url):
              """SSRF guard: allow only http/https to publicly-routable hosts.

              The scraper fetches user-controlled URLs, so without this a query
              like http://169.254.169.254/... or http://localhost/... would turn
              it into an open proxy into internal networks / the metadata service.
              Resolve the host and reject any non-global address (private,
              loopback, link-local, reserved, multicast)."""
              try:
                  parsed = urllib.parse.urlparse(url)
              except Exception:
                  return False, 'unparseable address'
              if parsed.scheme not in ('http', 'https'):
                  return False, f'scheme not allowed: {parsed.scheme or "(none)"}'
              host = parsed.hostname
              if not host:
                  return False, 'missing host'
              port = parsed.port or (443 if parsed.scheme == 'https' else 80)
              try:
                  infos = socket.getaddrinfo(host, port, proto=socket.IPPROTO_TCP)
              except socket.gaierror as exc:
                  return False, f'could not resolve host ({exc})'
              for info in infos:
                  ip = ipaddress.ip_address(info[4][0])
                  if not ip.is_global or ip.is_multicast:
                      return False, f'host resolves to non-public address {ip}'
              return True, 'ok'


          class _SSRFGuardedRedirect(urllib.request.HTTPRedirectHandler):
              """Re-run the SSRF guard on every redirect hop — a public page must
              not be able to bounce the fetch to an internal address."""
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  allowed, reason = is_safe_fetch_url(newurl)
                  if not allowed:
                      raise urllib.error.URLError(f'blocked redirect: {reason}')
                  return super().redirect_request(req, fp, code, msg, headers, newurl)


          def fetch_and_extract(query):
              """Fetch URL or search, return ButterFi markup."""
              q = query.strip()
              if q.startswith('http://') or q.startswith('https://'):
                  url = unwrap_ddg_redirect(q)  # a DDG /l/ wrapper -> real page
              elif ' ' not in q and BARE_DOMAIN.match(q):
                  url = 'https://' + q  # bare domain -> fetch, don't search
              else:
                  # DuckDuckGo's /html route now falls back to a generic landing
                  # page for this scraper UA; /lite still returns actual results.
                  url = f'https://lite.duckduckgo.com/lite/?q={urllib.request.quote(query)}'

              # SSRF guard: validate the scheme + resolved host before fetching,
              # and re-check every redirect (via the opener below).
              allowed, reason = is_safe_fetch_url(url)
              if not allowed:
                  return f'Cannot open that address ({reason}).'

              req = urllib.request.Request(url, headers={
                  'User-Agent': 'ButterFi/1.0 (educational-access-bridge)'
              })
              opener = urllib.request.build_opener(_SSRFGuardedRedirect)
              try:
                  # opener.open (not urllib.request.urlopen) so the redirect guard
                  # above applies; the initial URL is validated by is_safe_fetch_url.
                  with opener.open(req, timeout=15) as resp:
                      final_url = resp.url  # capture redirects
                      html = resp.read().decode('utf-8', errors='replace')
                  return html_to_butterfi(html, source_url=final_url)
              except Exception as e:
                  return f'Error fetching content: {str(e)}'


          def chunk_text(text, max_bytes):
              """Split text into UTF-8 byte chunks, respecting character boundaries."""
              encoded = text.encode('utf-8')
              chunks = []
              offset = 0
              while offset < len(encoded):
                  end = offset + max_bytes
                  if end >= len(encoded):
                      chunks.append(encoded[offset:])
                  else:
                      # Back up to avoid splitting a multi-byte UTF-8 character
                      while end > offset and (encoded[end] & 0xC0) == 0x80:
                          end -= 1
                      chunks.append(encoded[offset:end])
                  offset = end
              return chunks


          # Response payload format (byte 0): 0x00 = plain UTF-8, 0x01 = gzip.
          # The device relays these bytes opaquely; the browser reassembles every
          # chunk, reads byte 0, and inflates with DecompressionStream when gzip.
          RESP_FORMAT_PLAIN = 0x00
          RESP_FORMAT_GZIP = 0x01


          def chunk_bytes(data, max_bytes):
              """Split an opaque byte payload into fixed-size chunks."""
              if not data:
                  return [b'']
              return [data[i:i + max_bytes] for i in range(0, len(data), max_bytes)]


          def build_response_payload(text, chunk_size):
              """Return the [format][data] byte payload to chunk and send.

              Gzip-compresses the ButterFi markup when that is smaller (~3x on
              real pages), else sends plain UTF-8. Fits within 255 chunks by
              truncating the SOURCE text and recompressing (a gzip stream can't be
              sliced); most pages fit without any truncation."""
              budget = chunk_size * 255 - 1  # -1 for the format byte
              raw = text.encode('utf-8')
              comp = gzip.compress(raw, 6)
              if len(comp) <= budget:
                  if len(comp) < len(raw):
                      return bytes([RESP_FORMAT_GZIP]) + comp
                  if len(raw) <= budget:
                      return bytes([RESP_FORMAT_PLAIN]) + raw
              # Too big even compressed: shrink the source until the gzip fits.
              target = len(raw)
              for _ in range(8):
                  if comp:
                      target = min(target, int(target * budget / len(comp) * 0.95))
                  cut = raw[:max(0, target)]
                  while cut and (cut[-1] & 0xC0) == 0x80:  # don't split a UTF-8 char
                      cut = cut[:-1]
                  comp = gzip.compress(cut, 6)
                  if len(comp) <= budget:
                      return bytes([RESP_FORMAT_GZIP]) + comp
              # Fallback: plain, hard-truncated to the budget.
              cut = raw[:budget]
              while cut and (cut[-1] & 0xC0) == 0x80:
                  cut = cut[:-1]
              return bytes([RESP_FORMAT_PLAIN]) + cut


          def send_downlink(device_id, request_id, chunk_idx, total_chunks, chunk_data):
              """Send a single chunk as a Sidewalk downlink."""
              payload = bytes([0x81, request_id, chunk_idx, total_chunks]) + chunk_data
              payload_b64 = base64.b64encode(payload).decode('ascii')

              try:
                  iot_wireless.send_data_to_wireless_device(
                      Id=device_id,          # WirelessDeviceId (UUID), not SidewalkId
                      TransmitMode=0,  # 0 = best effort
                      PayloadData=payload_b64,
                      # Sidewalk downlinks require WirelessMetadata; without it
                      # SendDataToWirelessDevice fails ValidationException.
                      WirelessMetadata={
                          'Sidewalk': {
                              'Seq': chunk_idx,
                              'MessageType': 'CUSTOM_COMMAND_ID_NOTIFY'
                          }
                      }
                  )
                  print(f'Sent chunk {chunk_idx}/{total_chunks} to {device_id}')
              except Exception as e:
                  print(f'Downlink failed: {e}')


          def handler(event, context):
              table = dynamodb.Table(CHUNK_TABLE)
              ttl_epoch = int(time.time()) + (CHUNK_TTL * 3600)

              for record in event['Records']:
                  msg = json.loads(record['body'])
                  device_id = msg['deviceId']
                  request_id = msg['requestId']
                  query = msg['query']

                  print(f'Scraping for device={device_id} req={request_id} query={query}')

                  # Fetch and extract text
                  text = fetch_and_extract(query)

                  # Compress (gzip when smaller) behind a 1-byte format header,
                  # then chunk the opaque bytes. Fits within 255 chunks. The device
                  # relays the bytes; the browser reads the header and inflates.
                  # ~3x fewer downlink chunks over Sidewalk for real pages.
                  payload = build_response_payload(text, TEXT_CHUNK_SIZE)
                  chunks = chunk_bytes(payload, TEXT_CHUNK_SIZE)
                  total = min(len(chunks), 255)

                  fmt = 'gzip' if payload[:1] == bytes([RESP_FORMAT_GZIP]) else 'plain'
                  print(f'Generated {total} chunks ({len(payload)}B {fmt}) from {len(text)} chars')

                  # A reused request_id (browse.js resets its counter to 1 on
                  # reload) would collide with a previous transfer's chunks in
                  # DynamoDB, corrupting `total` and leaving orphans. Clear this
                  # request_id's chunks first.
                  stale = table.query(
                      KeyConditionExpression='deviceId = :d AND begins_with(chunkKey, :p)',
                      ExpressionAttributeValues={':d': device_id, ':p': f'{request_id:03d}#'},
                      ProjectionExpression='chunkKey'
                  )
                  with table.batch_writer() as batch:
                      for it in stale.get('Items', []):
                          batch.delete_item(Key={'deviceId': device_id, 'chunkKey': it['chunkKey']})

                  # Store all chunks in DynamoDB
                  with table.batch_writer() as batch:
                      for i, chunk in enumerate(chunks[:255]):
                          batch.put_item(Item={
                              'deviceId': device_id,
                              'chunkKey': f'{request_id:03d}#{i:04d}',
                              'data': base64.b64encode(chunk).decode('ascii'),
                              'total': total,
                              'requestId': request_id,
                              'query': query[:200],
                              'ttl': ttl_epoch
                          })

                  # Send first chunk immediately as downlink
                  if chunks:
                      send_downlink(device_id, request_id, 0, total, chunks[0])

              return {'statusCode': 200}

  ScraperEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ScrapeQueue.Arn
      FunctionName: !Ref ScraperLambda
      BatchSize: 1
      Enabled: true

  # ---------------------------------------------------------------
  # Lambda - Downlink handler (resends chunks on request)
  # ---------------------------------------------------------------
  DownlinkLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt DownlinkLambdaRole.Arn
      Timeout: 15
      MemorySize: 128
      Environment:
        Variables:
          CHUNK_TABLE: !Ref ChunkTable
      Code:
        ZipFile: |
          """
          ButterFi Downlink Handler
          
          Triggered via IoT Rule when a device requests chunk resend.
          Queries DynamoDB for stored chunks and sends them as downlinks.
          
          The device requests more data by sending:
            type=0x02, requestId, body=<next needed chunk index>
          """
          import json
          import os
          import base64
          import boto3

          dynamodb = boto3.resource('dynamodb')
          iot_wireless = boto3.client('iotwireless')

          CHUNK_TABLE = os.environ['CHUNK_TABLE']


          def handler(event, context):
              print(json.dumps(event))

              device_id = event.get('deviceId', '')
              request_id = int(event.get('requestId', 0))
              start_idx = int(event.get('startIdx', 0))

              if not device_id:
                  return {'statusCode': 400}

              table = dynamodb.Table(CHUNK_TABLE)

              # Query chunks for this device + request
              response = table.query(
                  KeyConditionExpression='deviceId = :did AND begins_with(chunkKey, :prefix)',
                  ExpressionAttributeValues={
                      ':did': device_id,
                      ':prefix': f'{request_id:03d}#'
                  }
              )

              items = sorted(response.get('Items', []), key=lambda x: x['chunkKey'])

              if not items:
                  print(f'No chunks found for {device_id} req={request_id}')
                  return {'statusCode': 404}

              total = int(items[0].get('total', len(items)))  # DynamoDB numbers read as Decimal

              # Send chunks starting from requested index
              # Rate-limit: Sidewalk has uplink/downlink rate limits,
              # so we send a few at a time and let the device re-request
              max_send = 3  # conservative batch to avoid rate limiting
              sent = 0

              for item in items:
                  idx = int(item['chunkKey'].split('#')[1])
                  if idx < start_idx:
                      continue
                  if sent >= max_send:
                      break

                  chunk_data = base64.b64decode(item['data'])
                  payload = bytes([0x81, request_id, idx, total]) + chunk_data
                  payload_b64 = base64.b64encode(payload).decode('ascii')

                  try:
                      iot_wireless.send_data_to_wireless_device(
                          Id=device_id,      # WirelessDeviceId (UUID) from the resend topic
                          TransmitMode=0,
                          PayloadData=payload_b64,
                          # Sidewalk downlinks require WirelessMetadata (see scraper).
                          WirelessMetadata={
                              'Sidewalk': {
                                  'Seq': idx,
                                  'MessageType': 'CUSTOM_COMMAND_ID_NOTIFY'
                              }
                          }
                      )
                      print(f'Resent chunk {idx}/{total} to {device_id}')
                      sent += 1
                  except Exception as e:
                      print(f'Downlink failed for chunk {idx}: {e}')
                      break

              return {'statusCode': 200, 'sent': sent}

  # ---------------------------------------------------------------
  # IoT Core - Sidewalk destination and rules
  # ---------------------------------------------------------------
  SidewalkDestination:
    Type: Custom::IoTWirelessDestination
    DependsOn:
      - SidewalkUplinkRule
    Properties:
      ServiceToken: !GetAtt DestinationManagerLambda.Arn
      Name: !Ref SidewalkDestinationName
      # MqttTopic delivery: IoT Wireless publishes each uplink to the topic the
      # SidewalkUplinkRule listens on ('butterfi/uplink'). This is the path
      # verified end-to-end. (RuleName delivery to !Ref SidewalkUplinkRule also
      # needs the role's iot:DescribeEndpoint permission added above; it was the
      # original value but was not re-verified after the permission fix.)
      Expression: butterfi/uplink
      ExpressionType: MqttTopic
      RoleArn: !GetAtt SidewalkRuleRole.Arn
      Description: Routes ButterFi Sidewalk uplinks to processing Lambda
      Region: !Ref AWS::Region
      AccountId: !Ref AWS::AccountId

  SidewalkUplinkRule:
    Type: AWS::IoT::TopicRule
    Properties:
      TopicRulePayload:
        Sql: "SELECT * FROM 'butterfi/uplink'"
        Actions:
          - Lambda:
              FunctionArn: !GetAtt UplinkLambda.Arn
        ErrorAction:
          CloudwatchLogs:
            LogGroupName: !Ref UplinkErrorLogGroup
            RoleArn: !GetAtt SidewalkRuleRole.Arn
        RuleDisabled: false

  # Resend rule - triggers downlink lambda when device requests chunks
  ResendRule:
    Type: AWS::IoT::TopicRule
    Properties:
      TopicRulePayload:
        Sql: "SELECT * FROM 'butterfi/resend/+'"
        Actions:
          - Lambda:
              FunctionArn: !GetAtt DownlinkLambda.Arn
        RuleDisabled: false

  DownlinkLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DownlinkLambda
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !GetAtt ResendRule.Arn

  # ---------------------------------------------------------------
  # CloudWatch - Logging and monitoring
  # ---------------------------------------------------------------
  UplinkErrorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  UplinkLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${UplinkLambda}
      RetentionInDays: 14

  ScraperLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ScraperLambda}
      RetentionInDays: 14

  DownlinkLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${DownlinkLambda}
      RetentionInDays: 14

  # ---------------------------------------------------------------
  # CloudWatch - Alarms for operational visibility
  # ---------------------------------------------------------------
  DLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Messages in the dead letter queue indicate scrape failures
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ScrapeDeadLetterQueue.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ScraperErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Scraper Lambda invocation errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ScraperLambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  SidewalkDestinationName:
    Description: Sidewalk destination name - use when provisioning devices
    Value: !Ref SidewalkDestinationName

  ScrapeQueueUrl:
    Description: SQS queue URL for scrape jobs
    Value: !Ref ScrapeQueue

  ChunkTableName:
    Description: DynamoDB table for response chunks
    Value: !Ref ChunkTable

  UplinkLambdaArn:
    Description: Uplink handler Lambda ARN
    Value: !GetAtt UplinkLambda.Arn

  ScraperLambdaArn:
    Description: Scraper Lambda ARN
    Value: !GetAtt ScraperLambda.Arn

  DownlinkLambdaArn:
    Description: Downlink handler Lambda ARN
    Value: !GetAtt DownlinkLambda.Arn

  DeployCommand:
    Description: Deploy with
    Value: >
      aws cloudformation deploy
      --template-file template.yaml
      --stack-name butterfi
      --capabilities CAPABILITY_NAMED_IAM
      --region <your-region>
