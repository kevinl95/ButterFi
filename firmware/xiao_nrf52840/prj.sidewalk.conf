# Sidewalk/Bluetooth enabled for the normal ButterFi runtime.
# This is the validated non-debug profile for real Sidewalk startup.

CONFIG_SIDEWALK=y
CONFIG_SIDEWALK_DFU=n
CONFIG_SIDEWALK_SUBGHZ_SUPPORT=n

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ButterFi"
CONFIG_BT_DEVICE_NAME_DYNAMIC=n

CONFIG_ASSERT=y
CONFIG_MEM_SLAB_POINTER_VALIDATE=n
CONFIG_SYSTEM_WORKQUEUE_WORK_TIMEOUT_MS=0
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=768
CONFIG_LOG_BACKED_RPC_CRASH_INFO_FILENAME_SIZE=1

# Give the app a real k_malloc pool and a larger system workqueue stack. The
# Zephyr default HEAP_MEM_POOL_SIZE=0 (no pool) is a latent defect worth
# fixing, but note: this was NOT confirmed to be the Sidewalk-registration
# blocker during hardware bring-up — the gateway link still dropped after this
# change (see docs/hardware-validation-checklist.md). The actual Sidewalk heap
# is a separate knob, CONFIG_SIDEWALK_HEAP_SIZE (default 5120 with
# SIDEWALK_ACE_OSAL_ZEPHYR), which is already adequate. Do NOT set
# CONFIG_MBEDTLS_HEAP_SIZE here — Sidewalk crypto uses PSA/nrf_security (static
# memory), and forcing the legacy mbedTLS heap faulted at early init.
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096