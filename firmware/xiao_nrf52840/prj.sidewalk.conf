# Sidewalk/Bluetooth enabled for the normal ButterFi runtime.
# This is the validated non-debug profile for real Sidewalk startup.

CONFIG_SIDEWALK=y
CONFIG_SIDEWALK_DFU=n
CONFIG_SIDEWALK_SUBGHZ_SUPPORT=n

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ButterFi"
CONFIG_BT_DEVICE_NAME_DYNAMIC=n

# NOTE: nRF Connect shows the SID_APP advertiser cycling its resolvable private
# address (RPA) rapidly — one identity, many MACs — which breaks FFN (gateway
# connects to an address that then stops existing). Root is the RPA churn from
# advertising restarts. The obvious fix, CONFIG_BT_SETTINGS=y (persist the BT
# identity/IRK), FAULTS AT BOOT here — it does not coexist with the way the
# Sidewalk stack already owns the settings subsystem/settings_storage. Left out
# until that integration is understood; see docs/hardware-validation-checklist.md.

CONFIG_ASSERT=y
CONFIG_MEM_SLAB_POINTER_VALIDATE=n
CONFIG_SYSTEM_WORKQUEUE_WORK_TIMEOUT_MS=0

# Give the app a real k_malloc pool and a larger system workqueue stack.
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# ── mfg ED25519 identity-key import fix ───────────────────────────────────
# CONFIRMED ROOT CAUSE. The mfg ED25519 device identity key is imported into
# PSA at boot; importing an Ed25519 key pair derives the public key from the
# private seed, which requires SHA-512. sdk-sidewalk's Kconfig.dependencies
# only `imply PSA_WANT_ALG_SHA_512 if SOC_SERIES_NRF54LX`, so on this nRF52840
# SHA-512 was absent: the id-1 import failed PSA -134 NOT_SUPPORTED, the FFN
# challenge could not be signed, and the gateway dropped the link every time
# (LOCALHOST_TERM_CONN — the RPA "churn" seen in scanners was a symptom, not
# the cause). Oberon provides SHA-512 in software (CC310 has none). The P256/AES
# keys (ids 2..5) don't need SHA-512, which is why only ED25519 id-1 failed.
# This is the load-bearing one-line fix, and it is a genuine sdk-sidewalk
# dependency gap worth reporting upstream — every BLE-only nRF52 build hits it.
CONFIG_PSA_WANT_ALG_SHA_512=y

# BISECTED on hardware (2026-08-12): SHA-512 (above) is the ONE fix. Both the
# search-era MBEDTLS_PSA_STATIC_KEY_SLOTS and the MBEDTLS_HEAP_SIZE=1024 bump
# were dropped and verified: at the stock 512B heap with dynamic key slots the
# mfg ED25519 import succeeds and the device reaches SID_STATE_READY (reg=0).
# The earlier PSA -141 on the import was a symptom of the SHA-512-less path, not
# heap pressure. NOTE: a `bt_ecc: Failed to generate ECC key -141` is logged at
# boot — but it is present *identically at 512 and 1024 heap* (verified), so the
# heap does not fix it and no bump is kept. It is Zephyr's BLE LE-Secure-
# Connections key gen; Sidewalk secures its own gateway link and does not use
# LE-SC, so registration and browsing are unaffected. Pre-existing and benign.
# (For the record: raising the heap to 4096/8192 faults this board pre-USB.)
# (Empirical warning from the search: heap 4096/8192 faults this board pre-USB
# even at ~41% RAM — never diagnosed, so don't raise the heap without a probe.)

# handle_host_frame() now runs on the main thread (the sole USB poller), so the
# config-save path (json_buffer[513] + config structs + NVS/flash driver +
# send_frame's ~519B frame) and the query uplink buffer share the main stack
# with sid_process(). Give it headroom; THREAD_ANALYZER confirms the mark.
CONFIG_MAIN_STACK_SIZE=8192

# Flash writes are already timeslot-scheduled against the radio — VERIFIED
# CONFIG_SOC_FLASH_NRF_RADIO_SYNC_MPSL=y in build/zephyr/.config (upstream's
# choice defaults to NONE for non-BT_LL_SW_SPLIT builds; the NCS MPSL override
# is what flips it, so this is worth re-checking after any SDK bump). But a
# full NVS page erase is one ~85ms NVMC operation that halts the CPU;
# requesting an 85ms radio gap while a BLE connection is active is hard and can
# stall the Sidewalk time-sync/registration handshake through several
# connection events. PARTIAL_ERASE slices it into ~3ms chunks so the radio
# interleaves, and the larger timeout multiplier keeps flash ops from failing
# while they wait for a timeslot during aggressive auto-connect activity.
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE=y
CONFIG_SOC_FLASH_NRF_TIMEOUT_MULTIPLIER=40

# ── Console + LOG (student build = single USB CDC, console/LOG on uart0) ───
# STUDENT DEFAULT: only the ButterFi runtime CDC (board_cdc_acm_uart) is
# exposed, so the browser's Web Serial picker shows exactly ONE device and a
# young student cannot pick the wrong one. app.overlay does NOT create the
# second CDC (CONFIG_BUTTERFI_LOG_CDC is off) and routes zephyr,console to the
# hardware uart0 instead.
#
# The console + LOG backend stay ENABLED (below) but land on uart0's physical
# pins, NOT on any USB CDC. This is deliberate and load-bearing: disabling the
# console/LOG outright (CONSOLE=n with zero log backends) FAULTS this board at
# boot — verified on hardware. Keeping the exact console+UART-backend path that
# is known to boot, just pointed at a hardware UART, avoids that fault, keeps
# the runtime CDC clean (no log text interleaved with the ButterFi protocol),
# and — unlike RTT — a bare TX line never blocks when nothing is listening.
# Field logs are readable with a cheap USB-UART adapter on the uart0 pins; the
# student never needs them.
#
# FIELD DEBUG: to get the log on a second /dev/ttyACM instead, merge
# prj.sidewalk-log.conf — it flips CONFIG_BUTTERFI_LOG_CDC=y (adds cdc_acm_uart1
# in app.overlay, which then reclaims zephyr,console). See the firmware README.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=n
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BUFFER_SIZE=4096
# Show Sidewalk's own modules at info level so link/registration events and the
# disconnect reason are visible.
CONFIG_LOG_DEFAULT_LEVEL=3
# (Crypto DBG logging was removed once the ED25519 import root cause was fixed —
# it flooded the console and hid the state machine. Re-enable only to debug
# crypto again: CONFIG_SIDEWALK_CRYPTO_LOG_LEVEL_DBG=y.)

# THREAD_ANALYZER is OFF here only to keep the runtime build lean (it adds an
# analyzer thread + per-thread name storage). RAM is NOT tight (~41% used), so
# this is a tidiness choice, not a necessity. KEEP A DEBUG BUILD VARIANT WITH
# IT ON — it is the instrument that catches the next stack overflow (it would
# have flagged the usb_thread overflow immediately instead of costing a
# session). See scripts/build-xiao.sh for how debug profiles are selected.
CONFIG_THREAD_ANALYZER=n