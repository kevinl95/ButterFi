# Sidewalk/Bluetooth enabled for the normal ButterFi runtime.
# This is the validated non-debug profile for real Sidewalk startup.

CONFIG_SIDEWALK=y
CONFIG_SIDEWALK_DFU=n
CONFIG_SIDEWALK_SUBGHZ_SUPPORT=n

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ButterFi"
CONFIG_BT_DEVICE_NAME_DYNAMIC=n

# NOTE: nRF Connect shows the SID_APP advertiser cycling its resolvable private
# address (RPA) rapidly — one identity, many MACs — which breaks FFN (gateway
# connects to an address that then stops existing). Root is the RPA churn from
# advertising restarts. The obvious fix, CONFIG_BT_SETTINGS=y (persist the BT
# identity/IRK), FAULTS AT BOOT here — it does not coexist with the way the
# Sidewalk stack already owns the settings subsystem/settings_storage. Left out
# until that integration is understood; see docs/hardware-validation-checklist.md.

CONFIG_ASSERT=y
CONFIG_MEM_SLAB_POINTER_VALIDATE=n
CONFIG_SYSTEM_WORKQUEUE_WORK_TIMEOUT_MS=0

# Give the app a real k_malloc pool and a larger system workqueue stack.
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# THE registration blocker (found via the CDC console log): the mfg ED25519
# device identity key is imported at boot as a PSA *persistent* key. That path
# (psa_save_persistent_key, oberon psa_crypto_storage.c) does
# `storage_data = mbedtls_calloc(1, storage_data_length)` and returns PSA -141
# INSUFFICIENT_MEMORY when it's NULL — which is exactly the boot failure
# (`MFG_ED25519 import failure`). Without the identity key every FFN handshake
# fails to sign the challenge (PSA -135 in ecc_dsa) and the device tears down
# the link (LOCALHOST_TERM_CONN). The credential is correct (keys verified
# present in the .bin), and the *same* persistent store succeeds later at FFN
# time (ecc_key_gen ids 3/4/5) — so it is heap pressure on the 512B mbedTLS
# heap at early boot, not a bad key.
#
# The obvious fix (raise CONFIG_MBEDTLS_HEAP_SIZE) FAULTS this build before USB
# at both 4096 and 8192 even though RAM is only ~41% used, so it is not a RAM
# overflow — a larger heap lets the store proceed past the calloc into a path
# that faults at boot. Instead remove the heap from the key-storage path
# entirely: MBEDTLS_PSA_STATIC_KEY_SLOTS makes the PSA core hold key material in
# a static buffer (no mbedtls_calloc), so the failing allocation disappears.
# Buffer must cover the largest key material (P256 public point = 65B); 256 is
# safe and a build-time static assert catches undersizing.
CONFIG_MBEDTLS_PSA_STATIC_KEY_SLOTS=y
CONFIG_MBEDTLS_PSA_STATIC_KEY_SLOT_BUFFER_SIZE=256
# STATIC_KEY_SLOTS alone did NOT clear the -141 (the failing calloc is the PSA
# key-slice array / ECC-import working buffer, not the key-data buffer). A big
# heap (4096/8192) faults pre-USB, but a *small* bump may clear the import
# while staying under that threshold. 8KB of static slot bss booted fine, so
# the fault is specific to the mbedTLS heap buffer size, not bss in general.
CONFIG_MBEDTLS_HEAP_SIZE=1024

# THE second half of the registration blocker: once the heap was large enough
# the mfg ED25519 import stopped failing -141 and instead failed PSA -134
# NOT_SUPPORTED. Ed25519 (pure EdDSA) needs SHA-512 to derive the public key
# from the 32-byte private seed on import (and to sign), but Sidewalk's
# Kconfig.dependencies only `imply PSA_WANT_ALG_SHA_512 if SOC_SERIES_NRF54LX`
# — so on this nRF52840 SHA-512 is absent and the import is unsupported. CC310
# has no SHA-512 in hardware; Oberon provides it in software. The P256/AES keys
# (ids 2..5) don't need SHA-512, which is why only the ED25519 id-1 import
# failed. Enable it explicitly.
CONFIG_PSA_WANT_ALG_SHA_512=y

# handle_host_frame() now runs on the main thread (the sole USB poller), so the
# config-save path (json_buffer[513] + config structs + NVS/flash driver +
# send_frame's ~519B frame) and the query uplink buffer share the main stack
# with sid_process(). Give it headroom; THREAD_ANALYZER confirms the mark.
CONFIG_MAIN_STACK_SIZE=8192

# Flash writes are already timeslot-scheduled against the radio — VERIFIED
# CONFIG_SOC_FLASH_NRF_RADIO_SYNC_MPSL=y in build/zephyr/.config (upstream's
# choice defaults to NONE for non-BT_LL_SW_SPLIT builds; the NCS MPSL override
# is what flips it, so this is worth re-checking after any SDK bump). But a
# full NVS page erase is one ~85ms NVMC operation that halts the CPU;
# requesting an 85ms radio gap while a BLE connection is active is hard and can
# stall the Sidewalk time-sync/registration handshake through several
# connection events. PARTIAL_ERASE slices it into ~3ms chunks so the radio
# interleaves, and the larger timeout multiplier keeps flash ops from failing
# while they wait for a timeslot during aggressive auto-connect activity.
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE=y
CONFIG_SOC_FLASH_NRF_TIMEOUT_MULTIPLIER=40

# ── Console + LOG over a second USB CDC ACM ───────────────────────────────
# The console (and LOG backend) is bound to a second USB CDC ACM interface
# (cdc_acm_uart1 in app.overlay), so the Sidewalk stack's own registration/FFN
# logs — including the disconnect reason — appear as a second /dev/ttyACM with
# no SWD probe and no USB-serial adapter. The first CDC ACM still carries the
# ButterFi binary protocol. Deferred mode keeps log formatting off the ISR/hot
# paths so it doesn't perturb radio timing.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=n
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_RTT=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG_BUFFER_SIZE=4096
# Show Sidewalk's own modules at info level so link/registration events and the
# disconnect reason are visible.
CONFIG_LOG_DEFAULT_LEVEL=3
# (Crypto DBG logging was removed once the ED25519 import root cause was fixed —
# it flooded the console and hid the state machine. Re-enable only to debug
# crypto again: CONFIG_SIDEWALK_CRYPTO_LOG_LEVEL_DBG=y.)

# THREAD_ANALYZER is intentionally OFF here: its per-thread name storage +
# analyzer thread add RAM, and with the mbedTLS heap now at the reference 4096
# every KB counts against colliding with the SoftDevice Controller reservation.
# Re-enable only for a dedicated stack-tuning build.
CONFIG_THREAD_ANALYZER=n