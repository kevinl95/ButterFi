# Sidewalk/Bluetooth enabled for the normal ButterFi runtime.
# This is the validated non-debug profile for real Sidewalk startup.

CONFIG_SIDEWALK=y
CONFIG_SIDEWALK_DFU=n
CONFIG_SIDEWALK_SUBGHZ_SUPPORT=n

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ButterFi"
CONFIG_BT_DEVICE_NAME_DYNAMIC=n

CONFIG_ASSERT=y
CONFIG_MEM_SLAB_POINTER_VALIDATE=n
CONFIG_SYSTEM_WORKQUEUE_WORK_TIMEOUT_MS=0

# Give the app a real k_malloc pool and a larger system workqueue stack. The
# Zephyr default HEAP_MEM_POOL_SIZE=0 (no pool) is a latent defect worth
# fixing, but note: this was NOT confirmed to be the Sidewalk-registration
# blocker during hardware bring-up — the gateway link still dropped after this
# change (see docs/hardware-validation-checklist.md). The actual Sidewalk heap
# is a separate knob, CONFIG_SIDEWALK_HEAP_SIZE (default 5120 with
# SIDEWALK_ACE_OSAL_ZEPHYR), which is already adequate. Do NOT set
# CONFIG_MBEDTLS_HEAP_SIZE here — Sidewalk crypto uses PSA/nrf_security (static
# memory), and forcing the legacy mbedTLS heap faulted at early init.
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# ── RTT logging ──────────────────────────────────────────────────────────
# This build deletes the UART console (app.overlay) and the XIAO has no
# onboard debugger, so there was NO log backend at all — fatal faults printed
# into the void (that is why the config-save stack overflow looked like a
# silent hang). Route Zephyr + Sidewalk logs to SEGGER RTT so they are
# readable over an external SWD probe wired to the XIAO's SWDIO/SWCLK/GND pads
# (JLinkRTTViewer, or `pyocd rtt` / OpenOCD `rtt`). Deferred mode keeps log
# formatting off the ISR/hot paths (immediate mode over a slow backend can
# inject latency into the Sidewalk timing that we are trying to observe).
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=n
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BUFFER_SIZE=4096
# Drop logs (don't block/back-pressure) when no probe is draining RTT — the
# device runs without a probe most of the time and must never stall on it.
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y

# Self-report thread stack high-water marks every 30s (would have caught the
# usb_thread overflow immediately instead of costing a session).
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=30
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_THREAD_NAME=y