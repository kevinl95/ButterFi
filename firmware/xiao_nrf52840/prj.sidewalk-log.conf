# Field-debug overlay fragment — merge ON TOP of prj.sidewalk.conf to move the
# Zephyr/Sidewalk console + LOG off the hardware uart0 and onto a SECOND USB CDC
# ACM, so the log (disconnect reason, registration events, etc.) is readable as
# a second /dev/ttyACM with no adapter. NOT for student units: it adds a second
# port to the Web Serial picker.
#
#   BUTTERFI_EXTRA_CONF_FILE="prj.sidewalk.conf;prj.sidewalk-log.conf"
#
# CONFIG_BUTTERFI_LOG_CDC creates cdc_acm_uart1 in app.overlay and reclaims
# zephyr,console for it. The console + UART LOG backend are already enabled in
# prj.sidewalk.conf, so flipping this one symbol is all that's needed.
CONFIG_BUTTERFI_LOG_CDC=y
